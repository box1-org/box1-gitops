apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: football-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: football-service-config
    namespace: football-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: football-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/football-service
    digest: sha256:26af00c7df3d10d4968ea4735f34ebd09df5f5193307adf7d7d5c434dcca6d46
