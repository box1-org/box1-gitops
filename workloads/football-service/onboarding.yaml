---
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: "football-service"
  namespace: box1-ci
spec:
  url: https://github.com/box1-org/football-service
  concurrency_limit: 1
  settings:
    pipelinerun_provenance: default_branch
    github_app_token_scope_repos:
    - box1-org/box1-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "football-service-image-puller"
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: "football-service"
  namespace: "football-service-dev"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "football-service-release-observer"
  namespace: "football-service-dev"
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - "football-service"
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "football-service-release-observer"
  namespace: "football-service-dev"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "football-service-release-observer"
subjects:
- kind: ServiceAccount
  name: ci-observe
  namespace: box1-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "football-service-release-observer"
  namespace: openshift-gitops
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  resourceNames:
  - "football-service"
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "football-service-release-observer"
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "football-service-release-observer"
subjects:
- kind: ServiceAccount
  name: ci-observe
  namespace: box1-ci
