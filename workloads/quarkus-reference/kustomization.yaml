apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quarkus-reference
labels:
  - pairs:
      backstage.io/kubernetes-id: quarkus-reference
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: quarkus-reference-config
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: quarkus-reference
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/quarkus-reference
    digest: sha256:f562e593cf0296a2f06bce3f4e886c39d391cb46494317d0a5619a52e6acbbd6
