apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      backstage.io/kubernetes-id: orders-service
    includeSelectors: false
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - onboarding.yaml
configMapGenerator:
  - name: orders-service-config
    namespace: orders-service-dev
    literals:
      - GREETING_PREFIX=Hello from box1
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -Djava.io.tmpdir=/tmp
images:
  - name: orders-service
    newName: image-registry.openshift-image-registry.svc:5000/box1-ci/orders-service
    digest: sha256:406e4102a18486888ee0a3e240ca63bd67a911550dfa504b662859eb9ce8acd7
