apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-golden-path-smoke
  namespace: quarkus-golden-path-smoke
  annotations:
    box1.org/source-revision: ad4ea06e40a74237d2a21e6e55384c2629a8ee70
    box1.org/build-pipelinerun: box1-ci/quarkus-golden-path-smoke-release-45x5g
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-golden-path-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-golden-path-smoke
        app.kubernetes.io/part-of: box1-golden-path
    spec:
      serviceAccountName: quarkus-golden-path-smoke
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: quarkus-golden-path-smoke
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quarkus-golden-path-smoke-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
