# Edge-site logs (box1-docs#132): lets the collector write to the LokiStack
# logging-loki application tenant. The LokiStack gateway (openshift-logging
# tenancy) checks verb create on resource application, resourceName logs, in
# group loki.grafana.com. Write only; reads stay with the logging tenancy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: box1-collector-logs-write-application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [loki.grafana.com]
    resources: [application]
    resourceNames: [logs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: box1-collector-logs-write-application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: box1-collector-logs-write-application
subjects:
  - kind: ServiceAccount
    name: box1-collector
    namespace: box1-observability

