# Default Prometheus datasource for Perses dashboards in box1-observability,
# matching the pattern OpenShift Virtualization uses (openshift-cnv
# perses-thanos-datasource): the cluster Thanos querier over the service CA.
# Users need permission to query cluster metrics (for example
# cluster-monitoring-view) to see data.
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: box1-thanos-querier
  namespace: box1-observability
spec:
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
  config:
    default: true
    display:
      name: OpenShift Monitoring (Thanos Querier)
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
            secret: box1-thanos-querier-secret

