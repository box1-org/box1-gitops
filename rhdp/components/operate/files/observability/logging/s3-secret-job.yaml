# Builds Secret logging-loki-s3 (the LokiStack S3 format) from the credentials
# NooBaa writes for the ObjectBucketClaim (Secret and ConfigMap
# "logging-loki"), so no credential is stored in Git. Runs on every sync.
# The Secret is created by this Job, not by Argo CD, so Argo never prunes it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logging-loki-s3-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logging-loki-s3-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    resourceNames: [logging-loki]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [logging-loki-s3]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logging-loki-s3-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: logging-loki-s3-sync
subjects:
  - kind: ServiceAccount
    name: logging-loki-s3-sync
    namespace: openshift-logging
---
apiVersion: batch/v1
kind: Job
metadata:
  name: logging-loki-s3-sync
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: logging-loki-s3-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # OpenShift 5.0.0-rc.7 release "cli" image (imagestream openshift/cli),
          # pulled with the cluster pull secret. Update after a cluster upgrade.
          image: quay.io/openshift-release-dev/ocp-v5.0-art-dev@sha256:bba4bacab7b9329df039b41327093b5d157992bd87c8256e66be11648c912d90
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: [/bin/bash, -ec]
          args:
            - |
              for i in $(seq 1 60); do
                oc get secret logging-loki -o name >/dev/null 2>&1 && \
                  oc get configmap logging-loki -o name >/dev/null 2>&1 && break
                echo "waiting for ObjectBucketClaim logging-loki to bind ($i)"; sleep 5
              done
              cm() { oc get configmap logging-loki -o "jsonpath={.data.$1}"; }
              key() { oc get secret logging-loki -o "jsonpath={.data.$1}" | base64 -d; }
              oc create secret generic logging-loki-s3 \
                --from-literal=bucketnames="$(cm BUCKET_NAME)" \
                --from-literal=endpoint="https://$(cm BUCKET_HOST):$(cm BUCKET_PORT)" \
                --from-literal=access_key_id="$(key AWS_ACCESS_KEY_ID)" \
                --from-literal=access_key_secret="$(key AWS_SECRET_ACCESS_KEY)" \
                --from-literal=forcepathstyle=true \
                --dry-run=client -o yaml | oc apply -f -
              echo "Secret logging-loki-s3 is up to date"

