# Dedicated NooBaa bucket for LokiStack chunks and index. NooBaa has one
# pv-pool backing store whose agent pod is not recreated after an eviction
# (box1-docs#43); while it is offline, Loki cannot flush or query older data.
# Kept on Application delete so stored logs are not lost by accident.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: logging-loki
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  generateBucketName: box1-logging-loki
  storageClassName: openshift-storage.noobaa.io

