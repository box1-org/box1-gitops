# Lets Argo CD manage the logging resources in openshift-logging. The
# namespace itself is created by observability-operators (logging.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: box1-logging-argocd
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [loki.grafana.com]
    resources: [lokistacks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [observability.openshift.io]
    resources: [clusterlogforwarders]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [objectbucket.io]
    resources: [objectbucketclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: box1-logging-argocd
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: box1-logging-argocd
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops

