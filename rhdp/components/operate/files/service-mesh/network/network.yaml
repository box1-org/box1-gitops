# OVN-Kubernetes local gateway mode, required for Istio ambient mode on
# OpenShift (kubelet probes of ambient pods). box1-docs#23, decision 001.
#
# Partial object: applied with server-side apply, so Argo CD owns only this
# field. Changing it rolls ovnkube-node, a short cluster-wide network
# interruption on the single node.
apiVersion: operator.openshift.io/v1
kind: Network
metadata:
  name: cluster
spec:
  defaultNetwork:
    ovnKubernetesConfig:
      gatewayConfig:
        routingViaHost: true

