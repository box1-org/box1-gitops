# Kiali: OpenShift login, no cluster-wide access, metrics from Thanos Querier
# (user-workload monitoring) and traces from the Box1 Tempo gateway (tenant dev).
# box1-docs#23, decision 003.
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  auth:
    strategy: openshift
  istio_namespace: istio-system
  deployment:
    cluster_wide_access: false
    # An explicit list: the Kiali operator resolves selectors only when it
    # reconciles and does not watch namespace labels, so a label-based
    # selector misses namespaces enrolled later. Listing the seven Box1
    # service namespaces up front lets them appear as they are enrolled
    # (box1-docs#23).
    discovery_selectors:
      default:
        - matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - istio-system
                - ztunnel
                - operations-console-dev
                - order-service-dev
                - inventory-service-dev
                - fulfillment-adapter-dev
                - notification-service-dev
                - asset-service-dev
                - scenario-controller-dev
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 1Gi
  external_services:
    prometheus:
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      auth:
        type: bearer
        use_kiali_token: true
      thanos_proxy:
        enabled: true
        retention_period: 7d
        scrape_interval: 30s
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      internal_url: https://tempo-box1-gateway.box1-observability.svc.cluster.local:8080/api/traces/v1/dev/tempo
      external_url: https://tempo-box1-jaegerui-box1-observability.apps.ocp.box1.org/api/traces/v1/dev/search
      auth:
        type: bearer
        use_kiali_token: true
      tempo_config:
        url_format: jaeger
    grafana:
      enabled: false

