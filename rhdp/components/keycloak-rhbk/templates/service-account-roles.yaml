# Realm Import creates service-account users automatically, so their role
# mappings are applied afterwards. Re-applying an existing role is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: box1-service-account-roles
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: box1-rhdp
    spec:
      restartPolicy: Never
      containers:
        - name: configure
          image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:91937e38d3507d29a4bc5898a77abda62a204b508c77c730cd0bc745dcdb0d03
          command: ["/bin/sh", "-ec"]
          args:
            - |
              kcadm=/opt/keycloak/bin/kcadm.sh
              config=/tmp/kcadm.config
              keytool -importcert -noprompt -alias service-ca \
                -file /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt \
                -keystore /tmp/service-ca.jks -storepass changeit
              "$kcadm" config credentials --config "$config" \
                --server https://keycloak.keycloak.svc:8443 \
                --realm master --user "$KEYCLOAK_ADMIN_USERNAME" \
                --password "$KEYCLOAK_ADMIN_PASSWORD" \
                --truststore /tmp/service-ca.jks --trustpass changeit
              for attempt in $(seq 1 60); do
                if "$kcadm" get realms/box1 --config "$config" \
                  --truststore /tmp/service-ca.jks --trustpass changeit >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              "$kcadm" get realms/box1 --config "$config" \
                --truststore /tmp/service-ca.jks --trustpass changeit >/dev/null
              client_id() {
                "$kcadm" get clients -r box1 -q "clientId=$1" --config "$config" \
                  --truststore /tmp/service-ca.jks --trustpass changeit \
                  | sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | head -n 1
              }
              ensure_role() {
                client="$1"
                role="$2"
                id="$(client_id "$client")"
                test -n "$id"
                if ! "$kcadm" get "clients/$id/roles/$role" -r box1 --config "$config" \
                  --truststore /tmp/service-ca.jks --trustpass changeit >/dev/null 2>&1; then
                  "$kcadm" create "clients/$id/roles" -r box1 --config "$config" \
                    --truststore /tmp/service-ca.jks --trustpass changeit -s "name=$role" >/dev/null
                fi
              }
              ensure_role agentic-operations aiops-viewer
              ensure_role agentic-operations aiops-analyst
              ensure_role asset-service chaos-operator
              ensure_role asset-service telemetry-writer
              ensure_role asset-service telemetry-reader
              ensure_role asset-service site-reporter
              ensure_role fulfillment-adapter fulfillment-writer
              ensure_role inventory-service inventory-admin
              ensure_role notification-service notification-reader
              ensure_role notification-service notification-fault-operator
              ensure_role operations-console console-viewer
              ensure_role operations-console console-operator
              ensure_role operations-console console-developer
              ensure_role scenario-controller scenario-viewer
              ensure_role scenario-controller scenario-operator
              "$kcadm" add-roles --config "$config" \
                --truststore /tmp/service-ca.jks --trustpass changeit -r box1 \
                --uusername service-account-developer-hub \
                --cclientid realm-management --rolename view-users --rolename query-groups
              "$kcadm" add-roles --config "$config" \
                --truststore /tmp/service-ca.jks --trustpass changeit -r box1 \
                --uusername service-account-scenario-controller \
                --cclientid inventory-service --rolename inventory-admin
              "$kcadm" add-roles --config "$config" \
                --truststore /tmp/service-ca.jks --trustpass changeit -r box1 \
                --uusername service-account-site-east \
                --cclientid asset-service --rolename site-reporter
              "$kcadm" add-roles --config "$config" \
                --truststore /tmp/service-ca.jks --trustpass changeit -r box1 \
                --uusername service-account-site-west \
                --cclientid asset-service --rolename site-reporter
          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
