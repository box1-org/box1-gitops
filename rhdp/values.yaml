# These are supplied automatically by ocp4_workload_field_content. They are
# intentionally blank here so this chart cannot be mistaken for a homelab
# bootstrap entry point.
deployer:
  domain: ""
  apiUrl: ""
gitops:
  repoURL: ""
  revision: main
  path: ""

# Start a new RHDP cluster with core + rhbk. The other profiles are opt-in
# because they need additional operators, credentials, and capacity.
profiles:
  core: true
  rhbk: true
  developer: false
  operate: false
  security: false
  ai: false

storage:
  rwoClass: ""
  objectBucketClass: ""

endpoints:
  registryHost: ""
  objectStorageEndpoint: ""

keycloak:
  # RHBK instance supplied by the RHDP cluster. It is backed by the existing
  # keycloak-pgsql-user and keycloak-initial-admin Secrets.
  instanceName: keycloak

# A child Application reads the same repo/revision as this chart. Components
# are profile-gated; setting one to false is the supported way to omit it.
components:
  keycloakRhbK:
    enabled: true
    profiles: [core, rhbk]
    name: keycloak-rhbk
    path: rhdp/components/keycloak-rhbk
    helm: true
    namespace: keycloak
    syncWave: "1"
  kafkaOperator:
    enabled: false
    profiles: [core]
    name: kafka-operator
    path: platform/kafka/operator
    namespace: openshift-operators
    syncWave: "0"
  kafka:
    enabled: false
    profiles: [core]
    name: box1-kafka
    path: platform/kafka
    namespace: box1-kafka
    syncWave: "1"
  pipelinesOperator:
    enabled: false
    profiles: [developer]
    name: pipelines-operator
    path: platform/pipelines/operator
    namespace: openshift-operators
    syncWave: "0"
  pipelinesConfig:
