apiVersion: v1
kind: ServiceAccount
metadata:
  name: box1-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
# Same-namespace Secrets the reconciler writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: box1-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: box1-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: box1-credentials
subjects:
  - kind: ServiceAccount
    name: box1-credentials
---
apiVersion: batch/v1
kind: Job
metadata:
  name: box1-credentials
  annotations:
    # Early in the Sync phase, so workloads that mount these Secrets start
    # with them; the CronJob finishes whatever is still missing.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: box1-credentials
      restartPolicy: Never
      containers:
        - name: reconcile
          image: box1-python
          command: [python3, /scripts/run.py]
          env:
            - name: PYTHONPATH
              value: /lib
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          envFrom:
            - configMapRef:
                name: box1-platform-settings
                optional: true
          resources:
            requests: {cpu: 10m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: lib, mountPath: /lib}
      volumes:
        - name: script
          configMap: {name: box1-credentials-script}
        - name: lib
          configMap: {name: box1-credentials-lib}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: box1-credentials
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: box1-credentials
          restartPolicy: Never
          containers:
            - name: reconcile
              image: box1-python
              command: [python3, /scripts/run.py]
              env:
                - name: PYTHONPATH
                  value: /lib
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef: {fieldPath: metadata.namespace}
              envFrom:
                - configMapRef:
                    name: box1-platform-settings
                    optional: true
              resources:
                requests: {cpu: 10m, memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /scripts}
                - {name: lib, mountPath: /lib}
          volumes:
            - name: script
              configMap: {name: box1-credentials-script}
            - name: lib
              configMap: {name: box1-credentials-lib}
