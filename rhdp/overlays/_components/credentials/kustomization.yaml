apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Credential reconciler used by RHDP overlays. The overlay supplies:
#   - ConfigMap box1-credentials-script with run.py
#     (configMapGenerator, disableNameSuffixHash);
#   - Roles binding ServiceAccount box1-credentials to the Secrets it may read
#     or write in other namespaces.
# Everything the Job needs is in sync wave -5 (overlays put their Roles and
# script ConfigMap there too); the Job is a Sync hook in wave -4.
# run.py imports k8s.py: generated values are created once and kept; missing
# inputs are reported by key name and the run still exits 0, so the CronJob
# converges once box1-rhdp-inputs is filled in.
resources:
  - runner.yaml
configMapGenerator:
  - name: box1-credentials-lib
    files:
      - k8s.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
