apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# TektonConfig plus the Pipelines-as-Code GitHub App Secret from
# box1-rhdp-inputs (PAC_GITHUB_APP_ID, PAC_GITHUB_APP_PRIVATE_KEY,
# PAC_WEBHOOK_SECRET). Console URLs are patched by the root chart.
resources:
  - ../../../platform/pipelines/config
  - inputs-access.yaml
components:
  - ../_components/platform-settings
  - ../_components/credentials
configMapGenerator:
  - name: box1-credentials-script
    files:
      - run.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
patches:
  # The shared credentials Component cannot know its namespace.
  - target: {kind: RoleBinding, name: box1-credentials}
    patch: |
      - {op: add, path: /subjects/0/namespace, value: openshift-pipelines}
