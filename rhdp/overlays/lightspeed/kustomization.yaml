apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# OLSConfig from platform/. The root chart replaces the providers (OpenAI and
# the homelab vLLM) with the RHDP LiteMaaS endpoint; run.py writes its key
# from LITEMAAS_API_KEY (inputs) or box1-rhdp-system/box1-rhdp-litemaas.
resources:
  - ../../../platform/lightspeed/config
  - inputs-access.yaml
  - cluster-access.yaml
components:
  - ../_components/platform-settings
  - ../_components/credentials
configMapGenerator:
  - name: box1-credentials-script
    files:
      - run.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
patches:
  # The shared credentials Component cannot know its namespace.
  - target: {kind: RoleBinding, name: box1-credentials}
    patch: |
      - {op: add, path: /subjects/0/namespace, value: openshift-lightspeed}
