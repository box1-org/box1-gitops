# Read access for the stackrox credential reconciler.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: box1-acs-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [keycloak-client-secret-rhacs-oidc]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: box1-acs-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: box1-acs-credentials
subjects:
  - kind: ServiceAccount
    name: box1-credentials
    namespace: stackrox
