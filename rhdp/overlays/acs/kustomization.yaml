apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Central and SecuredCluster from platform/. The root chart patches the route
# host, storage classes and cluster name; run.py builds the acs-oidc-config
# declarative auth provider from the rhacs-oidc Keycloak client. The operator
# is expected to register a SecuredCluster in Central's namespace without a
# manual init bundle (not verified on RHDP).
resources:
  - ../../../platform/advanced-cluster-security/instance
  - cluster-access.yaml
components:
  - ../_components/platform-settings
  - ../_components/credentials
configMapGenerator:
  - name: box1-credentials-script
    files:
      - run.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
patches:
  # The shared credentials Component cannot know its namespace.
  - target: {kind: RoleBinding, name: box1-credentials}
    patch: |
      - {op: add, path: /subjects/0/namespace, value: stackrox}
