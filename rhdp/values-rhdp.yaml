# Example catalog values. ocp4_workload_field_content injects deployer and
# gitops values, so a catalog normally passes only this file's profile choices.
profiles:
  core: true
  rhbk: true
  developer: false
  operate: false
  security: false
  ai: false

# Existing RHBK instance provisioned by the target RHDP cluster.
keycloak:
  instanceName: keycloak
