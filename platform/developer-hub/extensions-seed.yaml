apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-hub-extensions-seed
  namespace: rhdh
data:
  install-extensions.py: |
    """Stage UI overrides at the main-config level for the RHDH 1.9 installer."""
    import os
    import shutil
    import tempfile
    from pathlib import Path
    import yaml

    app_root = Path("/opt/app-root/src")
    cache_root = Path("/dynamic-plugins-root")
    extensions_file = cache_root / "dynamic-plugins.extensions.yaml"
    if not extensions_file.exists():
        temporary_file = extensions_file.with_suffix(".yaml.tmp")
        shutil.copyfile("/extensions-bootstrap/dynamic-plugins.extensions.yaml", temporary_file)
        temporary_file.chmod(0o600)
        temporary_file.replace(extensions_file)

    base = yaml.safe_load((app_root / "dynamic-plugins.yaml").read_text())
    extensions = yaml.safe_load(extensions_file.read_text())
    if not isinstance(extensions, dict) or not isinstance(extensions.get("plugins"), list):
        raise ValueError("Extensions configuration must contain a plugins list")

    # 1.9 rejects overrides duplicated between includes at the same level.
    # Promote the writable file's plugins into the installer's main plugins list.
    includes = [entry for entry in base.get("includes", []) if entry != str(extensions_file)]
    base["includes"] = list(dict.fromkeys(includes + extensions.get("includes", [])))
    base["plugins"] = extensions["plugins"] + base.get("plugins", [])
    staging = Path(tempfile.mkdtemp(prefix="extensions-installer-"))
    (staging / "dynamic-plugins.yaml").write_text(yaml.safe_dump(base, sort_keys=False))
    for name in ("dynamic-plugins", "dynamic-plugins.default.yaml"):
        (staging / name).symlink_to(app_root / name)
    os.chdir(staging)
    os.execvp("python3", ["python3", str(app_root / "install-dynamic-plugins.py"), str(cache_root)])

  # Bootstrap only: subsequent UI edits live on the PVC, not in this ConfigMap.
  dynamic-plugins.extensions.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-github-org-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions
        disabled: false
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-extensions-backend-dynamic
        disabled: false
        pluginConfig:
          extensions:
            installation:
              enabled: true
              saveToSingleFile:
                file: /opt/app-root/src/dynamic-plugins-root/dynamic-plugins.extensions.yaml
