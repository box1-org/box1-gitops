apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately excludes operator/: build/sync that application first.
resources:
  - namespace.yaml
  - app-config.yaml
  - dynamic-plugins.yaml
  - extensions-seed.yaml
  - dynamic-plugins-pvc.yaml
  - kubernetes-access.yaml
  - onboarding/access.yaml
  - backstage.yaml
configMapGenerator:
  - name: developer-hub-onboarding-plugin
    namespace: rhdh
    files:
      - onboarding/plugin/package.json
      - onboarding/plugin/index.cjs
      - onboarding/plugin/workflow.cjs
    options:
      disableNameSuffixHash: true
