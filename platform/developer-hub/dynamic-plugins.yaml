---
apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-hub-dynamic-plugins
  namespace: rhdh
data:
  # RHDH 2.1 (box1-docs#169). Bundled ./dynamic-plugins/dist wrappers are gone:
  # supported plugins resolve from the 2.1 catalog index with ref://<name>, and
  # community plugins use the rhdh-plugin-export-overlays release-2.1 artifacts.
  # The Extensions UI install path was retired; every plugin is declared here.
  # Intelligent Assistant plugins come from the Operator's intelligent-assistant
  # flavour (backstage.yaml), so they are not repeated here (RHDHBUGS-3928).
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: oci://registry.apps.ocp.box1.org/box1-plugins/box1-onboarding-plugin@sha256:209cbf816c7bbe65de442fc1649e31c07796658b8cc8d1a8ab38b60395fb1b47!box1-scaffolder-onboarding
        enabled: true
      # Sign-in providers are dynamic plugins in 2.1 (auth.providers.oidc / github).
      - package: ref://backstage-plugin-auth-backend-module-oidc-provider
        enabled: true
      - package: ref://backstage-plugin-auth-backend-module-github-provider
        enabled: true
      # Catalog providers (app-config catalog.providers.github / githubOrg / keycloakOrg).
      - package: ref://backstage-plugin-catalog-backend-module-github
        enabled: true
      - package: ref://backstage-plugin-catalog-backend-module-github-org
        enabled: true
      - package: ref://backstage-community-plugin-catalog-backend-module-keycloak
        enabled: true
      # Scaffolder publish:github and publish:gitlab.
      - package: ref://backstage-plugin-scaffolder-backend-module-github
        enabled: true
      - package: ref://backstage-plugin-scaffolder-backend-module-gitlab
        enabled: true
      # Kubernetes, Topology, Tekton (CI) and Argo CD entity tabs. NFS discovers
      # the frontend extensions from each package; no mount points are wired.
      - package: ref://backstage-plugin-kubernetes
        enabled: true
      - package: ref://backstage-plugin-kubernetes-backend
        enabled: true
      - package: ref://backstage-community-plugin-topology
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5!backstage-community-plugin-tekton
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                translationResources:
                  - importName: tektonTranslations
                    ref: tektonTranslationRef
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.54.9__3.1.3
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.54.9__1.7.2
        enabled: true
      # Box1 Operations homepage banner (box1-templates plugins/box1-home-banner,
      # 0.1.1 built from box1-templates 3cb8169). Content: app-config homepage layout.
      - package: oci://registry.apps.ocp.box1.org/box1-plugins/box1-home-banner@sha256:611dac1653d7e6d960e144d4c0cb238bfa5ac2670311bc87bbf15c4dcdaee5be!box1-backstage-plugin-home-banner
        enabled: true
      # Previously installed through the Extensions UI (now declared in git).
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-github-pull-requests:bs_1.54.9__3.9.0
        enabled: true
      # RHDH MCP server (Developer Preview) at /api/mcp-actions/v1 with the Catalog
      # and TechDocs tools; the 2.1 *-mcp-extras replace the 1.x *-mcp-tool plugins.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.9__0.2.1!backstage-plugin-mcp-actions-backend
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.9__0.2.5
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.9__0.2.6
        enabled: true
