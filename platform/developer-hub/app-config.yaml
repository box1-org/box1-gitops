---
apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-hub-app-config
  namespace: rhdh
data:
  app-config.yaml: |
    app:
      title: Box1 Developer Hub
      baseUrl: https://developer-hub.apps.ocp.box1.org
      # Home page (RHDH 2.1 New Frontend System). The homepage layout is
      # read-only so it forwards widgetLayout props into widgets; the Box1
      # Operations banner (box1-templates plugins/box1-home-banner) renders
      # props.content. Card choice and order are in homepage.defaultWidgets.
      # Arrays replace rather than merge, and this file loads after the plugin
      # defaults, so restate the TechDocs default add-on entries from the 2.1
      # catalog index. Re-check them on RHDH upgrades.
      extensions:
        - home-page-layout:homepage/dynamic-homepage-layout:
            config:
              customizable: false
              widgetLayout:
                box1-operations-banner:
                  props:
                    # Rendered as its own image beside the Markdown: RHDH 2.1's
                    # MarkdownContent strips data: URIs from Markdown images.
                    logo: ${BOX1_ICON_LOGO}
                    logoAlt: Box1
                    content: |
                      ## Box1 Operations Hub
                      Self-service delivery and day-2 operations for the Box1 OpenShift lab, powered by Red Hat Developer Hub.

                      | **Build** | **Deliver** | **Operate** |
                      | --- | --- | --- |
                      | Scaffold a service from a [golden-path template](/create) and code it in [OpenShift Dev Spaces](https://devspaces.apps.ocp.box1.org). | Pipelines as Code runs Tekton checks; [Argo CD](https://openshift-gitops-server-openshift-gitops.apps.ocp.box1.org) reconciles `box1-gitops` to the cluster. | Drive scenarios from the [Operations Console](https://operations-console-dev.apps.ocp.box1.org), trace traffic in [Kiali](https://kiali-istio-system.apps.ocp.box1.org), and ask the Intelligent Assistant. |
                      | [Software Catalog →](/catalog) | [OpenShift Console →](https://console-openshift-console.apps.ocp.box1.org) | [Box1 backlog →](https://github.com/box1-org/box1-docs/issues) |
        - addon:techdocs/expandable-navigation: false
        - addon:techdocs/report-issue
        - addon:techdocs/text-size: false
        - addon:techdocs/light-box: false
    organization:
      name: box1-org
    backend:
      baseUrl: https://developer-hub.apps.ocp.box1.org
      cors:
        origin: https://developer-hub.apps.ocp.box1.org
        credentials: true
      reading:
        allow:
          # Catalog API definitions may read only OpenAPI endpoints on service Routes.
          - host: '*.apps.ocp.box1.org'
            paths: ['/q/openapi']
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: box1-automation
              secret: ${BACKEND_SECRET}
          # RHDH MCP server clients (Intelligent Assistant). Token from
          # developer-hub-lightspeed-secrets; see README.
          - type: static
            options:
              token: ${MCP_TOKEN}
              subject: mcp-clients
      actions:
        # RHDH 2.1 *-mcp-extras plugin IDs (were *-mcp-tool before 2.1).
        pluginSources:
          - software-catalog-mcp-extras
          - techdocs-mcp-extras
      csp:
        upgrade-insecure-requests: false
        img-src:
          - "'self'"
          - "data:"
          - https://img.freepik.com
          - https://cdn.dribbble.com
          - https://avatars.githubusercontent.com
          - https://secure.gravatar.com
        script-src:
          - "'self'"
          - "'unsafe-eval'"
          - https://cdn.jsdelivr.net
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        github:
          production:
            clientId: ${GITHUB_APP_CLIENT_ID}
            clientSecret: ${GITHUB_APP_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
        oidc:
          production:
            metadataUrl: https://keycloak.apps.ocp.box1.org/auth/realms/box1/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            additionalScopes: 'profile email'
            prompt: login
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
    signInPage: oidc
    # Homepage cards, in order, with the pre-2.1 Box1 layouts (homepage-backend
    # homepage.defaultWidgets). Unlisted cards (Onboarding, Quick Access, Search)
    # are not shown. The grid does not compact, so y is the sum of the cards above.
    homepage:
      defaultWidgets:
        - id: box1-operations-banner
          ref: box1-operations-banner
          layout:
            xl: { w: 12, h: 6 }
            lg: { w: 12, h: 6 }
            md: { w: 12, h: 7 }
            sm: { w: 12, h: 8 }
            xs: { w: 12, h: 9 }
            xxs: { w: 12, h: 14 }
        - id: rhdh-entity-section
          ref: rhdh-entity-section
          layout:
            xl: { w: 12, h: 7 }
            lg: { w: 12, h: 7 }
            md: { w: 12, h: 8 }
            sm: { w: 12, h: 9 }
            xs: { w: 12, h: 11 }
            xxs: { w: 12, h: 15 }
        - id: rhdh-template-section
          ref: rhdh-template-section
          layout:
            xl: { w: 12, h: 5 }
            lg: { w: 12, h: 5 }
            md: { w: 12, h: 5 }
            sm: { w: 12, h: 5 }
            xs: { w: 12, h: 7.5 }
            xxs: { w: 12, h: 13.5 }
        - id: catalog-starred-entities-card
          ref: catalog-starred-entities-card
          layout:
            xl: { x: 0, y: 18, w: 6, h: 5 }
            lg: { x: 0, y: 18, w: 6, h: 5 }
            md: { x: 0, y: 20, w: 6, h: 5 }
            sm: { x: 0, y: 22, w: 6, h: 5 }
            xs: { x: 0, y: 27.5, w: 12, h: 5 }
            xxs: { x: 0, y: 42.5, w: 12, h: 5 }
        - id: recently-visited-card
          ref: recently-visited-card
          layout:
            xl: { x: 6, y: 18, w: 6, h: 5 }
            lg: { x: 6, y: 18, w: 6, h: 5 }
            md: { x: 6, y: 20, w: 6, h: 5 }
            sm: { x: 6, y: 22, w: 6, h: 5 }
            xs: { x: 0, y: 32.5, w: 12, h: 5 }
            xxs: { x: 0, y: 47.5, w: 12, h: 5 }
        - id: top-visited-card
          ref: top-visited-card
          layout:
            xl: { x: 0, y: 23, w: 6, h: 5 }
            lg: { x: 0, y: 23, w: 6, h: 5 }
            md: { x: 0, y: 25, w: 6, h: 5 }
            sm: { x: 0, y: 27, w: 6, h: 5 }
            xs: { x: 0, y: 37.5, w: 12, h: 5 }
            xxs: { x: 0, y: 52.5, w: 12, h: 5 }
        - id: featured-docs-card
          ref: featured-docs-card
          layout:
            xl: { x: 6, y: 23, w: 6, h: 5 }
            lg: { x: 6, y: 23, w: 6, h: 5 }
            md: { x: 6, y: 25, w: 6, h: 5 }
            sm: { x: 6, y: 27, w: 6, h: 5 }
            xs: { x: 0, y: 42.5, w: 12, h: 5 }
            xxs: { x: 0, y: 57.5, w: 12, h: 5 }
    # Developer Lightspeed was renamed Intelligent Assistant in RHDH 2.1. The
    # Operator's intelligent-assistant flavour runs Lightspeed Core as a sidecar;
    # its stack config (lightspeed.yaml) names the MCP server mcp-integration-tools.
    intelligent-assistant:
      servicePort: 8080
      mcpServers:
        - name: mcp-integration-tools
          token: ${MCP_TOKEN}
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
      # GitLab CE (platform/gitlab). rhdh-bot token, written by the gitlab
      # bootstrap Job into developer-hub-gitlab-secrets.
      gitlab:
        - host: gitlab.apps.ocp.box1.org
          apiBaseUrl: https://gitlab.apps.ocp.box1.org/api/v4
          token: ${GITLAB_TOKEN}
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      # CI is in box1-ci; select by entity ID across namespaces.
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: box1
              url: https://api.ocp.box1.org:6443
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: true
              serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
              # No caFile/caData: the API serves a Let's Encrypt certificate
              # (APIServer namedCertificates). A caFile replaces Node's root
              # store, and the token's ca.crt lacks ISRG Root X1, so the chain
              # failed with UNABLE_TO_GET_ISSUER_CERT. Node's public roots
              # (plus NODE_EXTRA_CA_CERTS) validate it; TLS stays strict.
      customResources:
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
        - group: tekton.dev
          apiVersion: v1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1
          plural: taskruns
        - group: tekton.dev
          apiVersion: v1
          plural: pipelines
        - group: tekton.dev
          apiVersion: v1
          plural: tasks
        - group: kubevirt.io
          apiVersion: v1
          plural: virtualmachines
        - group: kubevirt.io
          apiVersion: v1
          plural: virtualmachineinstances
        - group: cdi.kubevirt.io
          apiVersion: v1beta1
          plural: datavolumes
    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: openshift-gitops
              url: https://openshift-gitops-server-openshift-gitops.apps.ocp.box1.org
              token: ${ARGOCD_AUTH_TOKEN}
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
      locations:
        - type: url
          target: https://github.com/box1-org/box1-templates/blob/main/catalog-info.yaml
          rules:
            - allow: [Location, Template]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://keycloak.apps.ocp.box1.org/auth
            loginRealm: box1
            realm: box1
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 10 }
              initialDelay: { seconds: 15 }
        github:
          # Match the bundled plugin default to override its GITHUB_ORG placeholder.
          providerId:
            organization: box1-org
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
              # Retired repositories are excluded from live catalog discovery.
              repository: '^(?!football-service$|orders-service$|shipping-service$|quarkus-golden-path-smoke$).*'
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 10 }
              initialDelay: { seconds: 30 }
        githubOrg:
          id: box1-org
          githubUrl: https://github.com
          orgs:
            - box1-org
          schedule:
            frequency: { minutes: 30 }
            timeout: { minutes: 10 }
            initialDelay: { seconds: 15 }
