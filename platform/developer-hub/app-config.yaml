---
apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-hub-app-config
  namespace: rhdh
data:
  app-config.yaml: |
    app:
      title: Box1 Developer Hub
      baseUrl: https://developer-hub.apps.ocp.box1.org
    organization:
      name: box1-org
    backend:
      baseUrl: https://developer-hub.apps.ocp.box1.org
      cors:
        origin: https://developer-hub.apps.ocp.box1.org
        credentials: true
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: box1-automation
              secret: ${BACKEND_SECRET}
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        github:
          production:
            clientId: ${GITHUB_APP_CLIENT_ID}
            clientSecret: ${GITHUB_APP_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
    signInPage: github
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      # CI is in box1-ci; select by entity ID across namespaces.
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: box1
              url: https://api.ocp.box1.org:6443
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: true
              serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
              caFile: /platform/kubernetes/ca.crt
      customResources:
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
        - group: tekton.dev
          apiVersion: v1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1
          plural: taskruns
        - group: tekton.dev
          apiVersion: v1
          plural: pipelines
        - group: tekton.dev
          apiVersion: v1
          plural: tasks
    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: openshift-gitops
              url: https://openshift-gitops-server-openshift-gitops.apps.ocp.box1.org
              token: ${ARGOCD_AUTH_TOKEN}
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
      locations:
        - type: url
          target: https://github.com/box1-org/box1-templates/blob/main/catalog-info.yaml
          rules:
            - allow: [Location, Template]
      providers:
        github:
          # Match the bundled plugin default to override its GITHUB_ORG placeholder.
          providerId:
            organization: box1-org
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
              repository: '.*'
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 10 }
              initialDelay: { seconds: 30 }
        githubOrg:
          id: box1-org
          githubUrl: https://github.com
          orgs:
            - box1-org
          schedule:
            frequency: { minutes: 30 }
            timeout: { minutes: 10 }
            initialDelay: { seconds: 15 }
