---
apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-hub-app-config
  namespace: rhdh
data:
  app-config.yaml: |
    app:
      title: Box1 Developer Hub
      baseUrl: https://developer-hub.apps.ocp.box1.org
    organization:
      name: box1-org
    backend:
      baseUrl: https://developer-hub.apps.ocp.box1.org
      cors:
        origin: https://developer-hub.apps.ocp.box1.org
        credentials: true
      reading:
        allow:
          # Catalog API definitions may read only OpenAPI endpoints on service Routes.
          - host: '*.apps.ocp.box1.org'
            paths: ['/q/openapi']
      auth:
        externalAccess:
          - type: legacy
            options:
              subject: box1-automation
              secret: ${BACKEND_SECRET}
          # RHDH MCP server clients (Developer Lightspeed). Token from
          # developer-hub-lightspeed-secrets; see README.
          - type: static
            options:
              token: ${MCP_TOKEN}
              subject: mcp-clients
      actions:
        pluginSources:
          - software-catalog-mcp-tool
          - techdocs-mcp-tool
      csp:
        upgrade-insecure-requests: false
        img-src:
          - "'self'"
          - "data:"
          - https://img.freepik.com
          - https://cdn.dribbble.com
          - https://avatars.githubusercontent.com
          - https://secure.gravatar.com
        script-src:
          - "'self'"
          - "'unsafe-eval'"
          - https://cdn.jsdelivr.net
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        github:
          production:
            clientId: ${GITHUB_APP_CLIENT_ID}
            clientSecret: ${GITHUB_APP_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
        oidc:
          production:
            metadataUrl: https://keycloak.apps.ocp.box1.org/auth/realms/box1/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            additionalScopes: 'profile email'
            prompt: login
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
    signInPage: oidc
    lightspeed:
      servicePort: 8080
      mcpServers:
        - name: mcp::backstage
          token: ${MCP_TOKEN}
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      # CI is in box1-ci; select by entity ID across namespaces.
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: box1
              url: https://api.ocp.box1.org:6443
              authProvider: serviceAccount
              skipTLSVerify: false
              skipMetricsLookup: true
              serviceAccountToken: ${K8S_SERVICE_ACCOUNT_TOKEN}
              caFile: /platform/kubernetes/ca.crt
      customResources:
        - group: route.openshift.io
          apiVersion: v1
          plural: routes
        - group: tekton.dev
          apiVersion: v1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1
          plural: taskruns
        - group: tekton.dev
          apiVersion: v1
          plural: pipelines
        - group: tekton.dev
          apiVersion: v1
          plural: tasks
        - group: kubevirt.io
          apiVersion: v1
          plural: virtualmachines
        - group: kubevirt.io
          apiVersion: v1
          plural: virtualmachineinstances
        - group: cdi.kubevirt.io
          apiVersion: v1beta1
          plural: datavolumes
    argocd:
      appLocatorMethods:
        - type: config
          instances:
            - name: openshift-gitops
              url: https://openshift-gitops-server-openshift-gitops.apps.ocp.box1.org
              token: ${ARGOCD_AUTH_TOKEN}
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template]
      locations:
        - type: url
          target: https://github.com/box1-org/box1-templates/blob/main/catalog-info.yaml
          rules:
            - allow: [Location, Template]
      providers:
        keycloakOrg:
          default:
            baseUrl: https://keycloak.apps.ocp.box1.org/auth
            loginRealm: box1
            realm: box1
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 10 }
              initialDelay: { seconds: 15 }
        github:
          # Match the bundled plugin default to override its GITHUB_ORG placeholder.
          providerId:
            organization: box1-org
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
              # Retired repositories are excluded from live catalog discovery.
              repository: '^(?!football-service$|orders-service$|shipping-service$|quarkus-golden-path-smoke$).*'
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 10 }
              initialDelay: { seconds: 30 }
        githubOrg:
          id: box1-org
          githubUrl: https://github.com
          orgs:
            - box1-org
          schedule:
            frequency: { minutes: 30 }
            timeout: { minutes: 10 }
            initialDelay: { seconds: 15 }
    # Home page: replaces the stock "Get started / Explore / Learn" onboarding
    # banner with a Box1 operations banner showing the Box1 mark.
    # This file loads after app-config.dynamic-plugins.yaml and config arrays
    # replace rather than merge, so the full default card list (RHDH 1.9,
    # dynamic-home-page 1.10.x) is restated here minus OnboardingSection.
    # Re-check dynamic-plugins.default.yaml on RHDH upgrades.
    dynamicPlugins:
      frontend:
        red-hat-developer-hub.backstage-plugin-dynamic-home-page:
          mountPoints:
            - mountPoint: application/listener
              importName: VisitListener
            - mountPoint: home.page/cards
              importName: Markdown
              config:
                id: box1-operations-banner
                title: Box1 Operations
                cardLayout:
                  width: { minColumns: 4, maxColumns: 12, defaultColumns: 12 }
                  height: { minRows: 2, maxRows: 12, defaultRows: 4 }
                layouts:
                  xl: { w: 12, h: 6 }
                  lg: { w: 12, h: 6 }
                  md: { w: 12, h: 7 }
                  sm: { w: 12, h: 8 }
                  xs: { w: 12, h: 9 }
                  xxs: { w: 12, h: 14 }
                props:
                  content: |
                    ## Box1 Operations Hub
                    Self-service delivery and day-2 operations for the Box1 OpenShift lab, powered by Red Hat Developer Hub.

                    | ![Box1](${BOX1_ICON_LOGO}) | **Build** | **Deliver** | **Operate** |
                    | :---: | --- | --- | --- |
                    | | Scaffold a service from a [golden-path template](/create) and code it in [OpenShift Dev Spaces](https://devspaces.apps.ocp.box1.org). | Pipelines as Code runs Tekton checks; [Argo CD](https://openshift-gitops-server-openshift-gitops.apps.ocp.box1.org) reconciles `box1-gitops` to the cluster. | Drive scenarios from the [Operations Console](https://operations-console-dev.apps.ocp.box1.org), trace traffic in [Kiali](https://kiali-istio-system.apps.ocp.box1.org), and ask Developer Lightspeed. |
                    | | [Software Catalog →](/catalog) | [OpenShift Console →](https://console-openshift-console.apps.ocp.box1.org) | [Box1 backlog →](https://github.com/box1-org/box1-docs/issues) |
            - mountPoint: home.page/cards
              importName: EntitySection
              config:
                id: rhdh-entity-section
                title: Red Hat Developer Hub - Software Catalog
                cardLayout:
                  width: { minColumns: 4, maxColumns: 12, defaultColumns: 12 }
                  height: { minRows: 2, maxRows: 12, defaultRows: 4 }
                layouts:
                  xl: { w: 12, h: 7 }
                  lg: { w: 12, h: 7 }
                  md: { w: 12, h: 8 }
                  sm: { w: 12, h: 9 }
                  xs: { w: 12, h: 11 }
                  xxs: { w: 12, h: 15 }
            - mountPoint: home.page/cards
              importName: TemplateSection
              config:
                id: rhdh-template-section
                title: Red Hat Developer Hub - Explore templates
                cardLayout:
                  width: { minColumns: 4, maxColumns: 12, defaultColumns: 12 }
                  height: { minRows: 2, maxRows: 12, defaultRows: 4 }
                layouts:
                  xl: { w: 12, h: 5 }
                  lg: { w: 12, h: 5 }
                  md: { w: 12, h: 5 }
                  sm: { w: 12, h: 5 }
                  xs: { w: 12, h: 7.5 }
                  xxs: { w: 12, h: 13.5 }
            - mountPoint: home.page/cards
              importName: QuickAccessCard
              config: { id: quickaccess-card, title: Quick Access Card }
            - mountPoint: home.page/cards
              importName: SearchBar
              config:
                id: searchbar
                title: Search
                cardLayout:
                  width: { minColumns: 4, maxColumns: 12, defaultColumns: 12 }
                  height: { minRows: 1, maxRows: 2, defaultRows: 2 }
            # Cards with an id need explicit layouts or the home page hides them;
            # the grid does not compact, so y is the sum of the cards above.
            - mountPoint: home.page/cards
              importName: CatalogStarredEntitiesCard
              config:
                id: catalog-starred-entities-card
                title: Starred catalog entities
                layouts:
                  xl: { x: 0, y: 18, w: 6, h: 5 }
                  lg: { x: 0, y: 18, w: 6, h: 5 }
                  md: { x: 0, y: 20, w: 6, h: 5 }
                  sm: { x: 0, y: 22, w: 6, h: 5 }
                  xs: { x: 0, y: 27.5, w: 12, h: 5 }
                  xxs: { x: 0, y: 42.5, w: 12, h: 5 }
            - mountPoint: home.page/cards
              importName: RecentlyVisitedCard
              config:
                id: recently-visited-card
                title: Recently visited
                layouts:
                  xl: { x: 6, y: 18, w: 6, h: 5 }
                  lg: { x: 6, y: 18, w: 6, h: 5 }
                  md: { x: 6, y: 20, w: 6, h: 5 }
                  sm: { x: 6, y: 22, w: 6, h: 5 }
                  xs: { x: 0, y: 32.5, w: 12, h: 5 }
                  xxs: { x: 0, y: 47.5, w: 12, h: 5 }
            - mountPoint: home.page/cards
              importName: TopVisitedCard
              config:
                id: top-visited-card
                title: Top visited
                layouts:
                  xl: { x: 0, y: 23, w: 6, h: 5 }
                  lg: { x: 0, y: 23, w: 6, h: 5 }
                  md: { x: 0, y: 25, w: 6, h: 5 }
                  sm: { x: 0, y: 27, w: 6, h: 5 }
                  xs: { x: 0, y: 37.5, w: 12, h: 5 }
                  xxs: { x: 0, y: 52.5, w: 12, h: 5 }
            - mountPoint: home.page/cards
              importName: FeaturedDocsCard
              config:
                id: featured-docs-card
                title: Featured docs
                layouts:
                  xl: { x: 6, y: 23, w: 6, h: 5 }
                  lg: { x: 6, y: 23, w: 6, h: 5 }
                  md: { x: 6, y: 25, w: 6, h: 5 }
                  sm: { x: 6, y: 27, w: 6, h: 5 }
                  xs: { x: 0, y: 42.5, w: 12, h: 5 }
                  xxs: { x: 0, y: 57.5, w: 12, h: 5 }
