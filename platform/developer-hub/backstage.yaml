apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-app-config
    dynamicPluginsConfigMapName: developer-hub-dynamic-plugins
    extraEnvs:
      envs:
        # Extensions installation is supported only with a development runtime.
        - name: NODE_ENV
          value: development
      secrets:
        - name: developer-hub-secrets
    extraFiles:
      mountPath: /opt/app-root/src
    route:
      enabled: true
      host: developer-hub.apps.ocp.box1.org
  deployment:
    patch:
      spec:
        replicas: 1
        # One writer to the shared plugin cache and UI configuration file.
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            volumes:
              - name: dynamic-plugins-root
                # Remove the default volume source when selecting the persistent claim.
                ephemeral: null
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
              - name: extensions-bootstrap
                configMap:
                  name: developer-hub-extensions-seed
            initContainers:
              - name: install-dynamic-plugins
                command:
                  - /bin/sh
                  - -ec
                  - |
                    extensions_file=/dynamic-plugins-root/dynamic-plugins.extensions.yaml
                    if [ ! -e "$extensions_file" ]; then
                      cp /extensions-bootstrap/dynamic-plugins.extensions.yaml "$extensions_file.tmp"
                      chmod 600 "$extensions_file.tmp"
                      mv "$extensions_file.tmp" "$extensions_file"
                    fi
                    exec ./install-dynamic-plugins.sh /dynamic-plugins-root
                volumeMounts:
                  - name: extensions-bootstrap
                    mountPath: /extensions-bootstrap
                    readOnly: true
  database:
    enableLocalDb: true
    authSecretName: developer-hub-db
  # The Operator's PostgreSQL PVC uses the cluster default: lvms-vg1.
  # storageClassName is not a field under spec.database in this CRD.
