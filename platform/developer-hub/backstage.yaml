apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-app-config
    dynamicPluginsConfigMapName: developer-hub-dynamic-plugins
    extraEnvs:
      secrets:
        - name: developer-hub-secrets
    extraFiles:
      mountPath: /opt/app-root/src
    route:
      enabled: true
      host: developer-hub.apps.ocp.box1.org
  deployment:
    patch:
      spec:
        replicas: 1
  database:
    enableLocalDb: true
    authSecretName: developer-hub-db
  # The Operator's PostgreSQL PVC uses the cluster default: lvms-vg1.
  # storageClassName is not a field under spec.database in this CRD.
