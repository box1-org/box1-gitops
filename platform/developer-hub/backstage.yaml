apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-app-config
    dynamicPluginsConfigMapName: developer-hub-dynamic-plugins
    extraEnvs:
      envs:
        # Extensions installation is supported only with a development runtime.
        - name: NODE_ENV
          value: development
        - name: NODE_EXTRA_CA_CERTS
          value: /platform/trust/ca-bundle.crt
      secrets:
        - name: developer-hub-secrets
        - name: developer-hub-platform-secrets
    extraFiles:
      mountPath: /opt/app-root/src
    route:
      enabled: true
      host: developer-hub.apps.ocp.box1.org
  deployment:
    patch:
      spec:
        replicas: 1
        # One writer to the shared plugin cache and UI configuration file.
        strategy:
          $patch: replace
          type: Recreate
        template:
          metadata:
            annotations:
              box1.org/onboarding-plugin-digest: sha256:bdfaa2372a1dd6e29f897845f3550c4fb058f3b553523eb26f03689ce77a26b0
              box1.org/onboarding-plugin-revision: 63be64f75c705db5d3ab3a3ec701c791cef6e5e2
          spec:
            serviceAccountName: developer-hub-onboarding
            automountServiceAccountToken: true
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
              - name: extensions-bootstrap
                configMap:
                  name: developer-hub-extensions-seed
              - name: platform-kubernetes
                secret:
                  secretName: developer-hub-kubernetes-token
              - name: platform-trust
                configMap:
                  name: developer-hub-platform-trust
            containers:
              - name: backstage-backend
                env:
                  - name: K8S_SERVICE_ACCOUNT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: developer-hub-kubernetes-token
                        key: token
                volumeMounts:
                  - name: platform-kubernetes
                    mountPath: /platform/kubernetes
                    readOnly: true
                  - name: platform-trust
                    mountPath: /platform/trust
                    readOnly: true
            initContainers:
              - name: install-dynamic-plugins
                # Runs the Extensions adapter around the image's installer. Registry auth
                # comes from the Operator's dynamic-plugins-registry-auth Secret mount.
                command:
                  - python3
                  - /extensions-bootstrap/install-extensions.py
                volumeMounts:
                  - name: extensions-bootstrap
                    mountPath: /extensions-bootstrap
                    readOnly: true
  database:
    enableLocalDb: true
    authSecretName: developer-hub-db
  # The Operator's PostgreSQL PVC uses the cluster default: lvms-vg1.
  # storageClassName is not a field under spec.database in this CRD.
