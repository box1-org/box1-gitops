apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
spec:
  # RHDH 2.1 Intelligent Assistant flavour (default-on; listed for clarity). It
  # adds the IA plugins and the lightspeed-core sidecar, configured for vLLM by
  # lightspeed.yaml. The 1.10 flavour name 'lightspeed' no longer exists.
  flavours:
    - name: intelligent-assistant
      enabled: true
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: developer-hub-app-config
    dynamicPluginsConfigMapName: developer-hub-dynamic-plugins
    extraEnvs:
      envs:
        - name: NODE_EXTRA_CA_CERTS
          value: /platform/trust/ca-bundle.crt
      configMaps:
        # BOX1_ICON_LOGO data URI for the home banner.
        - name: developer-hub-branding
        # vLLM endpoint settings for the Intelligent Assistant sidecar.
        - name: developer-hub-lightspeed-env
          containers:
            - lightspeed-core
      secrets:
        - name: developer-hub-secrets
        - name: developer-hub-platform-secrets
        - name: developer-hub-lightspeed-secrets
        # Written by the gitlab bootstrap Job (platform/gitlab).
        - name: developer-hub-gitlab-secrets
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        # Replaces the flavour's bundled lightspeed-stack.yaml (vllm enabled).
        - name: developer-hub-lightspeed-stack
          key: lightspeed-stack.yaml
          mountPath: /app-root
          containers:
            - lightspeed-core
    route:
      enabled: true
      host: developer-hub.apps.ocp.box1.org
  deployment:
    patch:
      spec:
        replicas: 1
        # One writer to the shared dynamic plugin cache.
        strategy:
          $patch: replace
          type: Recreate
        template:
          metadata:
            annotations:
              box1.org/onboarding-plugin-digest: sha256:209cbf816c7bbe65de442fc1649e31c07796658b8cc8d1a8ab38b60395fb1b47
              box1.org/onboarding-plugin-revision: c0745643d7f31883e9719703c0613905171ef2d9
          spec:
            serviceAccountName: developer-hub-onboarding
            automountServiceAccountToken: true
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
              - name: platform-trust
                configMap:
                  name: developer-hub-platform-trust
            containers:
              - name: backstage-backend
                env:
                  - name: K8S_SERVICE_ACCOUNT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: developer-hub-kubernetes-token
                        key: token
                volumeMounts:
                  - name: platform-trust
                    mountPath: /platform/trust
                    readOnly: true
  database:
    enableLocalDb: true
    authSecretName: developer-hub-db
  # The Operator's PostgreSQL PVC uses the cluster default: lvms-vg1.
  # storageClassName is not a field under spec.database in this CRD.
