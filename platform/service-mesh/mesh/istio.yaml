# Istio ambient control plane, CNI node agent and ztunnel node proxy.
# box1-docs#23, decisions 002 and 005.
#
# Coexistence with the ingress operator's Gateway API istiod
# (revision openshift-gateway, openshift-ingress):
# - this control plane is revision "default" and only discovers namespaces
#   labelled istio-discovery=enabled (never openshift-ingress);
# - it writes istio-ca-root-cert; the gateway istiod uses openshift-gw-ca-root-cert.
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  version: v1.31.1
  namespace: istio-system
  profile: ambient
  updateStrategy:
    type: InPlace
  values:
    pilot:
      trustedZtunnelNamespace: ztunnel
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    meshConfig:
      discoverySelectors:
        - matchLabels:
            istio-discovery: enabled
      # Waypoint spans go to the existing Box1 collector (box1-docs#22).
      # Enabled per namespace by a Telemetry resource; nothing traces yet.
      extensionProviders:
        - name: box1-otel
          opentelemetry:
            service: box1-collector.box1-observability.svc.cluster.local
            port: 4317
---
# Privileged DaemonSet (CNI node agent).
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  version: v1.31.1
  namespace: istio-cni
  profile: ambient
---
# Privileged DaemonSet (L4 node proxy). Must be named default.
apiVersion: sailoperator.io/v1
kind: ZTunnel
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  version: v1.31.1
  namespace: ztunnel
