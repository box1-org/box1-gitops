# Red Hat OpenShift Service Mesh 3 operator (Sail). AllNamespaces install mode.
# Own namespace, not openshift-operators: a Manual subscription there would
# hold the automatic upgrades of the other operators in that namespace.
# Channel pinned to a minor (stable-3.5). box1-docs#23, decision 002.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-service-mesh-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-service-mesh-operator
  namespace: openshift-service-mesh-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-service-mesh-operator
spec:
  channel: stable-3.5
  installPlanApproval: Manual
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
