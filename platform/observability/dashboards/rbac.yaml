# Lets Argo CD manage Perses dashboards and datasources in box1-observability.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: box1-observability-dashboards-argocd
  namespace: box1-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [perses.dev]
    resources: [persesdashboards, persesdatasources]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: box1-observability-dashboards-argocd
  namespace: box1-observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: box1-observability-dashboards-argocd
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
