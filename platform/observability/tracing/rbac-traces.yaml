# Per-tenant trace access for the Tempo gateway (OpenShift mode). The gateway
# checks these with SubjectAccessReviews: verb create = write, get = read, on
# resource <tenantName> with resourceName "traces" in group tempo.grafana.com.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: box1-traces-write-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [tempo.grafana.com]
    resources: [dev]
    resourceNames: [traces]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: box1-traces-write-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: box1-traces-write-dev
subjects:
  - kind: ServiceAccount
    name: box1-collector
    namespace: box1-observability
---
# Read access to tenant "dev". Cluster admins already have it. To let another
# user or group read traces (console Traces view or Jaeger UI), bind this
# ClusterRole to them; the gateway also requires that the reader can view at
# least one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: box1-traces-read-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [tempo.grafana.com]
    resources: [dev]
    resourceNames: [traces]
    verbs: [get]
