# One OTLP collector for all services:
#   gRPC http://box1-collector.box1-observability.svc:4317
#   HTTP http://box1-collector.box1-observability.svc:4318
# A Tempo outage fills a bounded queue and then drops spans (counted in the
# collector's otelcol_exporter_send_failed_spans metric, scraped by
# user-workload monitoring through the operator-created ServiceMonitor); it never blocks the
# services, which export asynchronously in batches.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: box1
  namespace: box1-observability
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch: {}
    exporters:
      otlp_grpc/tempo:
        endpoint: tempo-box1.box1-observability.svc:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 2000   # export requests, not spans
        retry_on_failure:
          enabled: true
          max_elapsed_time: 120s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/tempo]
