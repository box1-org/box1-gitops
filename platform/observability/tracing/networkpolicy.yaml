# Tempo accepts spans only from the collector. The router reaches only the
# OAuth proxy (8443) in front of the Jaeger UI. User-workload monitoring
# reaches only the HTTP server (3200), which serves /metrics; no other
# namespace can reach the query API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-box1
  namespace: box1-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo-monolithic
      app.kubernetes.io/instance: box1
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 3200
---
# The collector accepts unauthenticated OTLP from any namespace (services do
# not restrict egress). Any pod could inject or flood spans; memory_limiter
# bounds the impact. Accepted for the lab. It also accepts metrics scrapes
# from user-workload monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: box1-collector
  namespace: box1-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - protocol: TCP
          port: 8888
