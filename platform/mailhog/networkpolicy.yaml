# Deny all ingress except: SMTP from notification-service-dev, and HTTPS (the OAuth proxy) from the router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailhog
  namespace: mailhog
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mailhog
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notification-service-dev
      ports:
        - protocol: TCP
          port: 1025
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
