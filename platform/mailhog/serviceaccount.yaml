# The OAuth proxy logs users in through the OpenShift OAuth server as this service account's client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailhog
  namespace: mailhog
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mailhog"}}
automountServiceAccountToken: true
