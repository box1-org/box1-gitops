# PostgreSQL 15 for Langfuse's transactional data (users, orgs, projects, API keys, prompts, scores config).
# OpenShift catalog image (imagestream openshift/postgresql:15-el9), pinned by digest. Single instance on node-local
# LVM storage: the PVC is not a backup. Recreate keeps two database processes off the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres-data
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvms-vg1
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  namespace: langfuse
spec:
  selector:
    app.kubernetes.io/name: langfuse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-postgres
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: langfuse
            - name: POSTGRESQL_USER
              value: langfuse
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: DATABASE_PASSWORD
            # Langfuse expects the database to run in UTC.
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-postgres-data
