# Langfuse web: UI and public API (ingestion, OpenTelemetry endpoint). On start the entrypoint applies the PostgreSQL
# and ClickHouse migrations, then headless initialisation creates org "box1", project "box1-default" (with the API keys
# from langfuse-secrets) and the local owner langfuse-admin@box1.local if they do not exist yet.
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  selector:
    app.kubernetes.io/name: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-web
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: docker.io/langfuse/langfuse@sha256:2b47d0ae63ae737996a58cc03536a73230c809a2371c230c9bea4b7653a0b6a0  # 4.77.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            # OpenShift runs the image under an arbitrary UID with no home directory; Prisma and Node need a writable one.
            - name: HOME
              value: /tmp
            - name: PORT
              value: "3000"
            # Browsers and SDKs outside the cluster fetch and upload media through presigned URLs on the public
            # NooBaa route; the web server itself uses the in-cluster endpoint.
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: https://s3-openshift-storage.apps.ocp.box1.org
            - name: LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT
              value: https://s3.openshift-storage.svc
            # Keycloak SSO (realm box1). New users join org box1 as Viewer, which applies to every project in it
            # (per-project roles, LANGFUSE_DEFAULT_PROJECT_*, need Langfuse's enterprise rbac-project-roles
            # entitlement and are not set). Only the local owner may create organisations. Local self-signup is
            # closed at the Route (route.yaml), not here, because AUTH_DISABLE_SIGNUP would also refuse first-time
            # SSO users.
            - name: AUTH_KEYCLOAK_ISSUER
              value: https://keycloak.apps.ocp.box1.org/auth/realms/box1
            - name: AUTH_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-keycloak
                  key: CLIENT_ID
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-keycloak
                  key: CLIENT_SECRET
            - name: LANGFUSE_DEFAULT_ORG_ID
              value: box1
            - name: LANGFUSE_DEFAULT_ORG_ROLE
              value: VIEWER
            - name: LANGFUSE_ALLOWED_ORGANIZATION_CREATORS
              value: langfuse-admin@box1.local
            # Headless initialisation (idempotent; existing org, project, keys and user are left alone).
            - name: LANGFUSE_INIT_ORG_ID
              value: box1
            - name: LANGFUSE_INIT_ORG_NAME
              value: Box1
            - name: LANGFUSE_INIT_PROJECT_ID
              value: box1-default
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: box1-default
            - name: LANGFUSE_INIT_USER_EMAIL
              value: langfuse-admin@box1.local
            - name: LANGFUSE_INIT_USER_NAME
              value: Langfuse Admin
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: DATABASE_PASSWORD
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: REDIS_AUTH
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: ENCRYPTION_KEY
            - name: LANGFUSE_INIT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_USER_PASSWORD
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: LANGFUSE_INIT_PROJECT_SECRET_KEY
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: langfuse-bucket
                  key: BUCKET_NAME
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: langfuse-bucket
                  key: BUCKET_NAME
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: langfuse-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: LANGFUSE_S3_BATCH_EXPORT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: langfuse-bucket
                  key: BUCKET_NAME
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 2Gi
          # Migrations run before the server listens, so allow up to 10 minutes on first start.
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/public/ready
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: service-ca
              mountPath: /etc/langfuse/service-ca
              readOnly: true
      volumes:
        - name: service-ca
          configMap:
            name: langfuse-service-ca
