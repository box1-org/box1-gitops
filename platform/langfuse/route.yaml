# Public endpoint: UI, public API and OTLP ingestion. Edge TLS with the cluster's wildcard certificate.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  host: langfuse.apps.ocp.box1.org
  to:
    kind: Service
    name: langfuse-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Closes local email/password self-signup. The router sends the longest matching path to this Route, whose Service
# has no endpoints, so /api/auth/signup and /api/auth/signup-verify answer 503 and never reach Langfuse.
# Keycloak users are still created on first SSO sign-in (NextAuth callback, not this path). Langfuse's own
# AUTH_DISABLE_SIGNUP cannot be used: it refuses first-time SSO users too.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse-signup-disabled
  namespace: langfuse
spec:
  host: langfuse.apps.ocp.box1.org
  path: /api/auth/signup
  to:
    kind: Service
    name: langfuse-signup-disabled
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-signup-disabled
  namespace: langfuse
spec:
  selector:
    app.kubernetes.io/name: langfuse-signup-disabled-no-endpoints
  ports:
    - name: http
      port: 3000
      targetPort: 3000
