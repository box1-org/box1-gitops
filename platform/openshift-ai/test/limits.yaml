{
  "apiVersion": "v1",
  "kind": "LimitRange",
  "metadata": {
    "name": "box1-ai-test",
    "namespace": "box1-ai-test"
  },
  "spec": {
    "limits": [
      {
        "type": "Container",
        "defaultRequest": {
          "cpu": "100m",
          "memory": "256Mi"
        },
        "default": {
          "cpu": "2",
          "memory": "4Gi"
        }
      }
    ]
  }
}
