{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "workbench",
    "namespace": "box1-ai-test",
    "labels": {
      "opendatahub.io/dashboard": "true"
    },
    "annotations": {
      "openshift.io/display-name": "Workbench storage"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "lvms-vg1",
    "resources": {
      "requests": {
        "storage": "10Gi"
      }
    }
  }
}
