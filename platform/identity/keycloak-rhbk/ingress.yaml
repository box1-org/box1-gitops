apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: box1-keycloak
  annotations:
    route.openshift.io/termination: reencrypt
spec:
  ingressClassName: openshift-default
  tls:
    - hosts:
        - keycloak.apps.ocp.box1.org
      secretName: keycloak-tls
  rules:
    - host: keycloak.apps.ocp.box1.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8443
