apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  # Reuse the PostgreSQL deployment and protected PVC; it contains no legacy
  # Keycloak API resources and remains valid for RHBK.
  - ../keycloak/database
  - certificate.yaml
  - ingress.yaml
  - keycloak.yaml
  - realm-import.yaml
