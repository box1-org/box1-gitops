# Asset telemetry service console and API (box1-docs#15, decision D-013).
# Public client: authorization code + PKCE only, so no client secret exists anywhere.
# Client roles: chaos-operator (console and control API), telemetry-writer (ingestion API), telemetry-reader (read API).
# Assigning a role to a person is done in the Keycloak admin console; this file assigns none.
apiVersion: keycloak.org/v1alpha1
kind: KeycloakClient
metadata:
  name: asset-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  realmSelector:
    matchLabels:
      realm: box1
  client:
    clientId: asset-service
    name: Asset telemetry service
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false
    redirectUris:
      - https://asset-service-dev.apps.ocp.box1.org/console/*
    webOrigins:
      - https://asset-service-dev.apps.ocp.box1.org
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://asset-service-dev.apps.ocp.box1.org/signed-out.html
    defaultClientScopes:
      - profile
      - roles
      - web-origins
    optionalClientScopes: []
    protocolMappers:
      - name: asset-service-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: asset-service
          access.token.claim: "true"
          id.token.claim: "false"
  roles:
    - name: chaos-operator
      description: Use the asset telemetry load and chaos console and its control API
      clientRole: true
    - name: telemetry-writer
      description: Post readings to the asset telemetry ingestion API
      clientRole: true
    - name: telemetry-reader
      description: Read readings and alerts from the asset telemetry API
      clientRole: true
