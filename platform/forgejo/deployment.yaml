apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    # After the admin-secret Job (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One RWO volume holding SQLite: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      serviceAccountName: forgejo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Generates the server secrets on the PVC once, migrates the database and
        # keeps the admin account's password equal to the forgejo-admin Secret.
        - name: setup
          image: codeberg.org/forgejo/forgejo@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3  # 17.0.1-rootless
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /var/lib/gitea/secrets && chmod 0700 /var/lib/gitea/secrets
              for k in SECRET_KEY INTERNAL_TOKEN JWT_SECRET; do
                f=/var/lib/gitea/secrets/$(echo "$k" | tr A-Z a-z)
                [ -s "$f" ] || { forgejo generate secret "$k" > "$f"; chmod 0600 "$f"; }
              done
              # OpenShift assigns an arbitrary UID per namespace; Forgejo refuses to
              # start unless RUN_USER matches it. Persisted in app.ini on the PVC.
              export FORGEJO____RUN_USER="$(id -un 2>/dev/null || id -u)"
              /usr/local/bin/docker-setup.sh
              forgejo migrate
              if forgejo admin user list --admin | awk 'NR>1{print $2}' | grep -qx "$ADMIN_USER"; then
                forgejo admin user change-password --username "$ADMIN_USER" --password "$ADMIN_PASSWORD" --must-change-password=false >/dev/null
              else
                forgejo admin user create --admin --username "$ADMIN_USER" --password "$ADMIN_PASSWORD" \
                  --email "$ADMIN_USER@forgejo.invalid" --must-change-password=false
              fi
          envFrom: &config
            - configMapRef:
                name: forgejo-config
          env:
            - name: ADMIN_USER
              valueFrom: {secretKeyRef: {name: forgejo-admin, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: forgejo-admin, key: password}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts: &mounts
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3  # 17.0.1-rootless
          envFrom: *config
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext: *containerSecurity
          volumeMounts: *mounts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
# Forgejo settings as FORGEJO__<section>__<KEY>, applied to app.ini at every start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-config
  namespace: forgejo
data:
  FORGEJO__server__DOMAIN: forgejo.apps.ocp.box1.org
  FORGEJO__server__ROOT_URL: https://forgejo.apps.ocp.box1.org/
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__DISABLE_SSH: "true"
  FORGEJO__server__START_SSH_SERVER: "false"
  FORGEJO__server__OFFLINE_MODE: "true"
  FORGEJO__database__DB_TYPE: sqlite3
  FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__security__SECRET_KEY: ""
  FORGEJO__security__SECRET_KEY_URI: file:/var/lib/gitea/secrets/secret_key
  FORGEJO__security__INTERNAL_TOKEN: ""
  FORGEJO__security__INTERNAL_TOKEN_URI: file:/var/lib/gitea/secrets/internal_token
  FORGEJO__oauth2__JWT_SECRET: ""
  FORGEJO__oauth2__JWT_SECRET_URI: file:/var/lib/gitea/secrets/jwt_secret
  # Accounts come only from the bootstrap Job.
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
  FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
  FORGEJO__repository__DEFAULT_PRIVATE: private
  FORGEJO__repository__DEFAULT_BRANCH: main
  # Webhooks may reach only the in-cluster Pipelines as Code controller.
  FORGEJO__webhook__ALLOWED_HOST_LIST: pipelines-as-code-controller.openshift-pipelines.svc
  FORGEJO__actions__ENABLED: "false"
  FORGEJO__packages__ENABLED: "false"
  FORGEJO__mailer__ENABLED: "false"
  FORGEJO__log__LEVEL: Info
