apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Forgejo proof (box1-docs#164). A self-contained Git server, an idempotent
# bootstrap, and the Forgejo CI/CD lane (ci/). To replay on another cluster,
# change params.env and the Forgejo host in ci/*.yaml (not yet parameterized).
labels:
  - pairs:
      app.kubernetes.io/part-of: box1-forgejo
    includeSelectors: false
resources:
  - namespaces.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - bootstrap-jobs.yaml
  - ci/repository.yaml
  - ci/rbac.yaml
  - ci/registrar.yaml
  - ci/tasks.yaml
  - ci/argocd.yaml
configMapGenerator:
  - name: forgejo-params
    namespace: forgejo
    envs:
      - params.env
  - name: forgejo-bootstrap
    namespace: forgejo
    files:
      - bootstrap/bootstrap.py
  # Seed files for workloads-proof; "__" stands for "/". Added only when missing.
  - name: forgejo-workloads-seed
    namespace: forgejo
    files:
      - seed/.tekton__validate.yaml
      - seed/apps__README.md
  - name: fj-ci-scripts
    namespace: box1-fj-ci
    files:
      - ci/validate.py
      - ci/promote.py
  - name: fj-registrar
    namespace: box1-fj-ci
    files:
      - ci/registrar.py
generatorOptions:
  disableNameSuffixHash: true
replacements:
  # One place for the public host name: params.env FORGEJO_HOST.
  - source: {kind: ConfigMap, name: forgejo-params, fieldPath: data.FORGEJO_HOST}
    targets:
      - select: {kind: Route, name: forgejo}
        fieldPaths: [spec.host]
      - select: {kind: ConfigMap, name: forgejo-config}
        fieldPaths: [data.FORGEJO__server__DOMAIN]
      - select: {kind: ConfigMap, name: forgejo-config}
        fieldPaths: [data.FORGEJO__server__ROOT_URL]
        options: {delimiter: /, index: 2}
