# HTTPS only (SSH is disabled). Edge TLS uses the ingress wildcard certificate.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: forgejo
  namespace: forgejo
spec:
  host: forgejo.example.invalid  # replaced from params.env FORGEJO_HOST
  to:
    kind: Service
    name: forgejo
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
