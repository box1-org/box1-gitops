# Required check for every promotion PR. Branch protection on main requires the
# status context "Pipelines as Code CI / workloads-proof-validate*".
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: workloads-proof-validate
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  timeouts:
    pipeline: 10m
  pipelineSpec:
    workspaces:
      - name: basic-auth
    tasks:
      - name: validate
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: forgejo-gitops-validate}
            - {name: namespace, value: box1-fj-ci}
        params:
          - {name: repo-url, value: "{{ repo_url }}"}
          - {name: revision, value: "{{ revision }}"}
          - {name: target-branch, value: "{{ target_branch }}"}
        workspaces:
          - {name: basic-auth, workspace: basic-auth}
  workspaces:
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
