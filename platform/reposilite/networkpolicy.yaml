# Deny all ingress except: Maven clients in box1-ci on 8080 (no login), and the
# router to the OAuth proxy on 8443 (dashboard behind the OpenShift login).
# Egress is unrestricted so Reposilite can reach repo.maven.apache.org.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reposilite
  namespace: box1-maven
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reposilite
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: box1-ci
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
