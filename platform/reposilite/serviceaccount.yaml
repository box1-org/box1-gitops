# The OAuth proxy logs users in through the OpenShift OAuth server as this service account's client.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reposilite
  namespace: box1-maven
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"reposilite"}}
automountServiceAccountToken: true
