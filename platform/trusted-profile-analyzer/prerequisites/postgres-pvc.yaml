{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "postgres-data",
    "namespace": "trusted-profile-analyzer",
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "lvms-vg1",
    "resources": {
      "requests": {
        "storage": "45Gi"
      }
    }
  }
}
