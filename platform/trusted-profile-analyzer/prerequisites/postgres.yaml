{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "rhtpa-postgres",
    "namespace": "trusted-profile-analyzer"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "rhtpa-postgres"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "rhtpa-postgres"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "postgres",
            "image": "registry.redhat.io/rhel9/postgresql-15@sha256:95e94264e14133d80ddbc9980eeebf4806d6668a61cbc1917e57efa1941b516b",
            "env": [
              {
                "name": "POSTGRESQL_DATABASE",
                "value": "trustify"
              },
              {
                "name": "POSTGRESQL_USER",
                "value": "trustify"
              },
              {
                "name": "POSTGRESQL_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "rhtpa-database",
                    "key": "password"
                  }
                }
              },
              {
                "name": "POSTGRESQL_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "rhtpa-database",
                    "key": "admin-password"
                  }
                }
              }
            ],
            "ports": [
              {
                "containerPort": 5432
              }
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "512Mi"
              },
              "limits": {
                "memory": "4Gi"
              }
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-c",
                  "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""
                ]
              },
              "initialDelaySeconds": 10
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": 5432
              },
              "initialDelaySeconds": 60
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/pgsql/data"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "postgres-data"
            }
          }
        ]
      }
    }
  }
}
