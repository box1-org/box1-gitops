apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: dev-spaces
spec:
  components:
    pluginRegistry:
      # The embedded registry lacks Kaoto (redhat.vscode-kaoto) and Tekton
      # (redhat.vscode-tekton-pipelines), which Box1 devfiles recommend
      # (box1-docs#114). open-vsx.org has both, plus everything the embedded one had.
      openVSXURL: https://open-vsx.org
  devEnvironments:
    maxNumberOfWorkspacesPerUser: -1
    maxNumberOfRunningWorkspacesPerUser: 3
    # Nested containers (podman run with networking, Testcontainers) in workspaces
    # (box1-docs#114). Uses the built-in OpenShift nested-container SCC: every
    # workspace pod then runs in its own user namespace (hostUsers: false), so the
    # SETUID/SETGID capabilities and devices below do not apply on the host.
    # /dev/net/tun lets rootless podman set up container networking (pasta);
    # /dev/fuse enables fuse-overlayfs storage. Applies to all workspaces.
    # Revert: delete this block (back to the operator default, run disabled) and sync.
    disableContainerRunCapabilities: false
    containerRunConfiguration:
      openShiftSecurityContextConstraint: nested-container
      workspacesPodAnnotations:
        io.kubernetes.cri-o.Devices: /dev/fuse,/dev/net/tun
      containerSecurityContext:
        allowPrivilegeEscalation: true
        procMount: Unmasked
        capabilities:
          add:
            - SETGID
            - SETUID
