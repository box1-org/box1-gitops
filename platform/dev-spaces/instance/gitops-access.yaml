apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-spaces-argocd
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - org.eclipse.che
    resources:
      - checlusters
      - checlusters/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-spaces-argocd
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-spaces-argocd
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
