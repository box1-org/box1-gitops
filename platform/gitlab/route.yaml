# HTTPS only; Omnibus nginx serves plain HTTP behind the edge Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitlab
  namespace: gitlab
spec:
  host: gitlab.example.invalid  # replaced from params.env GITLAB_HOST
  to:
    kind: Service
    name: gitlab
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
