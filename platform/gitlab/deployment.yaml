apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab
    spec:
      # Omnibus runs its services as root and drops to service users itself:
      # needs the anyuid SCC (RoleBinding in rbac.yaml).
      serviceAccountName: gitlab
      automountServiceAccountToken: false
      containers:
        - name: gitlab
          image: docker.io/gitlab/gitlab-ce@sha256:fde2dacdec6307a142c3f28bc07c62e534bccf47bc7ffb3a4e81a90e1cf0c5b7  # 19.5.4-ce.0
          command: [/bin/bash, -c, "/opt/box1/seed-token.sh & exec /assets/init-container"]
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              valueFrom: {configMapKeyRef: {name: gitlab-omnibus, key: gitlab.rb}}
            - name: GITLAB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: gitlab-admin, key: password}}
            - name: BOX1_ROOT_TOKEN
              valueFrom: {secretKeyRef: {name: gitlab-admin, key: token}}
          ports:
            - name: http
              containerPort: 8929
          resources:
            requests: {cpu: 500m, memory: 3Gi}
            limits: {cpu: "4", memory: 4Gi}
          startupProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8929/-/readiness]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8929/-/readiness]}
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [curl, -fsS, http://127.0.0.1:8929/-/liveness]}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /etc/gitlab, subPath: etc}
            - {name: data, mountPath: /var/opt/gitlab, subPath: opt}
            - {name: logs, mountPath: /var/log/gitlab}
            - {name: shm, mountPath: /dev/shm}
            - {name: scripts, mountPath: /opt/box1, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gitlab-data}
        - name: logs
          emptyDir: {sizeLimit: 2Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
        - name: scripts
          configMap: {name: gitlab-scripts, defaultMode: 0555}
