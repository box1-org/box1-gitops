apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: box1-acs-argocd
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - platform.stackrox.io
    resources:
      - centrals
      - centrals/status
      - securedclusters
      - securedclusters/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: box1-acs-argocd
  namespace: stackrox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: box1-acs-argocd
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
