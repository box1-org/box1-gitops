apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
spec:
  central:
    declarativeConfiguration:
      secrets:
        - name: acs-oidc-config
    exposure:
      route:
        enabled: true
        host: acs.apps.ocp.box1.org
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
    persistence:
      persistentVolumeClaim:
        claimName: central
        size: 20Gi
        storageClassName: lvms-vg1
    db:
      resources:
        requests:
          cpu: 50m
          memory: 2Gi
      persistence:
        persistentVolumeClaim:
          claimName: central-db
          size: 20Gi
          storageClassName: lvms-vg1
  scanner:
    scannerComponent: Enabled
    analyzer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
    db:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
  scannerV4:
    scannerComponent: Enabled
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
    matcher:
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
    db:
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          size: 20Gi
          storageClassName: lvms-vg1
