apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  clusterName: box1
  centralEndpoint: central.stackrox:443
  admissionControl:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    enforcement: Disabled
    failurePolicy: Ignore
  sensor:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  scannerV4:
    scannerComponent: AutoSense
  perNode:
    collector:
      collection: CORE_BPF
  customize:
    deploymentDefaults:
      pinToNodes: None
