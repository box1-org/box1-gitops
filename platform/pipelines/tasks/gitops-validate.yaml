---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: box1-gitops-validate
  namespace: box1-ci
spec:
  params:
  - name: revision
    type: string
    default: ''
  - name: git-auth-secret
    type: string
    default: ''
  steps:
  - name: validate
    image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
    env:
    - name: HOME
      value: "/tekton/home"
    - name: REVISION
      value: "$(params.revision)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: "$(params.git-auth-secret)"
          key: git-provider-token
    script: |
      #!/usr/bin/env python3
      import base64, json, os, re, time, urllib.request, urllib.error

      def github(path, method='GET', body=None):
          request=urllib.request.Request('https://api.github.com'+path, method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                       'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                       'User-Agent':'box1-tekton'})
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  data=response.read()
                  return json.loads(data) if data else None
          except urllib.error.HTTPError as error:
              detail=json.loads(error.read())
              raise RuntimeError('GitHub API %s %s: %s %s' % (method,path,error.code,detail.get('message',''))) from None

      import hashlib, io, pathlib, subprocess, zipfile
      ZERO='sha256:'+'0'*64
      PROFILE_LABEL='box1.org/workload-profile'

      def documents(rendered):
          """Split rendered Kustomize output into (kind, name, text) documents."""
          docs=[]
          for text in re.split(r'(?m)^---\n',rendered):
              kind=re.search(r'(?m)^kind: (\S+)$',text)
              name=re.search(r'(?m)^  name: (\S+)$',text)
              if kind: docs.append((kind.group(1),name.group(1) if name else '',text))
          return docs

      def profile_of(rendered):
          namespaces=[t for k,_,t in documents(rendered) if k=='Namespace']
          labels=[m.group(1) for t in namespaces for m in [re.search(r'(?m)^    '+re.escape(PROFILE_LABEL)+r': (\S+)$',t)] if m]
          profile=labels[0] if labels else 'service'
          assert profile in ['service','virtual-machine'], 'Unknown workload profile '+profile
          return profile

      def check_service(name, rendered):
          expected=r'image-registry\.openshift-image-registry\.svc:5000/box1-ci/'+name+r'@sha256:[a-f0-9]{64}'
          images=re.findall(r'^\s+image: (.+)$',rendered,re.M)
          runtime_images=[image for image in images if re.fullmatch(expected,image)]
          assert len(runtime_images)==1, 'Runtime image must be digest-pinned exactly once to its service in box1 registry'
          for kind in ['Deployment','Service','Route','ConfigMap','ServiceAccount','Namespace']:
              assert 'kind: '+kind+'\n' in rendered, 'Missing '+kind
          for probe in ['startupProbe:','readinessProbe:','livenessProbe:']:
              assert probe in rendered
          if runtime_images[0].endswith('@sha256:'+'0'*64):
              assert re.search(r'^  replicas: 0$',rendered,re.M), 'Unbuilt onboarding workloads must stay at zero replicas'

      def check_vm(name, rendered):
          docs=documents(rendered)
          kinds=[k for k,_,_ in docs]
          for kind in ['Namespace','ServiceAccount','Secret','VirtualMachine']:
              assert kind in kinds, 'Missing '+kind
          for kind in ['Deployment','StatefulSet','DaemonSet','Pod']:
              assert kind not in kinds, 'Virtual machine workloads must not include '+kind
          assert not re.findall(r'^\s+image: ',rendered,re.M), 'Virtual machine workloads must not run container images'
          vms=[t for k,n,t in docs if k=='VirtualMachine']
          assert len(vms)==1 and [n for k,n,_ in docs if k=='VirtualMachine']==[name], 'Exactly one VirtualMachine named after the workload'
          vm=vms[0]
          os_digest=re.findall(r'(?m)^    box1\.org/os-image-digest: (sha256:[a-f0-9]{64})$',vm)
          assert len(os_digest)==1, 'VirtualMachine must record box1.org/os-image-digest exactly once'
          assert re.search(r'(?m)^    box1\.org/source-revision: [a-f0-9]{40}$',vm), 'VirtualMachine must record box1.org/source-revision'
          strategy=re.findall(r'(?m)^  runStrategy: (\S+)$',vm)
          assert len(strategy)==1, 'VirtualMachine must set spec.runStrategy'
          assert not re.search(r'(?m)^  dataVolumeTemplates:',vm), 'Use a separate DataVolume; dataVolumeTemplates keep placeholder sources'
          for serial in ['serviceca','regtoken']:
              assert re.search(r'(?m)^ +serial: '+serial+'$',vm), 'VirtualMachine is missing the '+serial+' disk for bootc updates'
          assert re.search(r'(?m)^ +(- )?dataVolume:\n +name: '+re.escape(name)+r'-root$',vm), 'Root disk must use DataVolume '+name+'-root'
          tokens=[t for k,_,t in docs if k=='Secret' and 'type: kubernetes.io/service-account-token' in t]
          assert tokens, 'Missing the updater service-account token Secret'
          for t in tokens:
              assert not re.search(r'(?m)^(data|stringData):',t), 'Service-account token Secrets must not carry data in Git'
          for t in [t for k,_,t in docs if k=='Secret' and t not in tokens]:
              values=re.findall(r'(?m)^  [A-Za-z0-9_.-]+: (.+)$',t.split('stringData:',1)[1]) if 'stringData:' in t else []
              assert 'stringData:' in t and not re.search(r'(?m)^data:',t) and values and all(re.fullmatch(r'"?(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|ssh-rsa) [A-Za-z0-9+/=]+( [^"]*)?"?',v) for v in values), 'Only SSH public keys may be stored in Secrets'
          dvs=[t for k,_,t in docs if k=='DataVolume']
          disk=r'docker://image-registry\.openshift-image-registry\.svc:5000/box1-ci/'+re.escape(name)+r'-disk@(sha256:[a-f0-9]{64})'
          if os_digest[0]==ZERO:
              assert strategy[0]=='Halted', 'Unbuilt virtual machines must stay Halted'
              assert not dvs, 'Unbuilt virtual machines must not create their DataVolume yet'
          else:
              assert len(dvs)==1, 'Promoted virtual machines need exactly one root DataVolume'
              urls=re.findall(r'(?m)^ +url: (\S+)$',dvs[0])
              assert len(urls)==1 and re.fullmatch(disk,urls[0]) and not urls[0].endswith(ZERO), 'Root DataVolume must pull the digest-pinned '+name+'-disk image'
              assert re.search(r'(?m)^ +pullMethod: node$',dvs[0]), 'Root DataVolume must use pullMethod: node'

      def validate(name, rendered):
          assert re.fullmatch('[a-z][a-z0-9-]{2,39}',name)
          profile=profile_of(rendered)
          (check_vm if profile=='virtual-machine' else check_service)(name, rendered)
          return profile

      if __name__=='__main__':
          sha=os.environ['REVISION']; assert re.fullmatch('[a-f0-9]{40}',sha)
          req=urllib.request.Request('https://api.github.com/repos/box1-org/box1-workloads-dev/zipball/'+sha,
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'box1-gitops-validator'})
          with urllib.request.urlopen(req,timeout=60) as response: archive=zipfile.ZipFile(io.BytesIO(response.read()))
          root=pathlib.Path('/tmp/gitops-validation'); root.mkdir()
          for entry in archive.infolist():
              p=pathlib.PurePosixPath(entry.filename)
              assert not p.is_absolute() and '..' not in p.parts
          archive.extractall(root)
          checkout=next(root.iterdir())
          url='https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl'
          with urllib.request.urlopen(url,timeout=60) as response: binary=response.read()
          with urllib.request.urlopen(url+'.sha256',timeout=30) as response: expected=response.read().decode().strip()
          assert hashlib.sha256(binary).hexdigest()==expected
          kubectl=root/'kubectl'; kubectl.write_bytes(binary); kubectl.chmod(0o755)
          targets=sorted((checkout/'workloads').glob('*/kustomization.yaml'))
          assert targets, 'No workload targets found'
          for target in targets:
              name=target.parent.name
              rendered=subprocess.check_output([str(kubectl),'kustomize',str(target.parent)],text=True)
              profile=validate(name, rendered)
              if profile=='virtual-machine':
                  print('PASS: Kustomize, VirtualMachine, pinned OS and disk digests, update disks: '+name)
              else:
                  print('PASS: Kustomize, resources, probes, immutable image: '+name)
          print('Validated '+str(len(targets))+' workloads at '+sha)
