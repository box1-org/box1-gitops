---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: box1-gitops-validate
  namespace: box1-ci
spec:
  params:
  - name: revision
    type: string
    default: ''
  - name: git-auth-secret
    type: string
    default: ''
  steps:
  - name: validate
    image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
    env:
    - name: HOME
      value: "/tekton/home"
    - name: REVISION
      value: "$(params.revision)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: "$(params.git-auth-secret)"
          key: git-provider-token
    # Optional cluster/org settings (RHDP); absent on the homelab, so the defaults apply.
    envFrom:
    - configMapRef:
        name: box1-platform-settings
        optional: true
    script: |
      #!/usr/bin/env python3
      import base64, json, os, re, time, urllib.parse, urllib.request, urllib.error

      GIT_HOST=os.environ.get('BOX1_GIT_HOST','github.com')
      GIT_ORG=os.environ.get('BOX1_GIT_ORG','box1-org')
      GITOPS_REPO_URL=os.environ.get('BOX1_GITOPS_REPO_URL','https://github.com/box1-org/box1-gitops')
      WORKLOADS_REPO_URL=os.environ.get('BOX1_WORKLOADS_REPO_URL','https://github.com/box1-org/box1-workloads-dev')

      def repo_slug(url):
          """owner/name of a repository URL: https://github.com/box1-org/x(.git) -> box1-org/x."""
          return urllib.parse.urlsplit(url).path.strip('/').removesuffix('.git')

      # A code-only repository's PaC token may never reach the GitOps repositories.
      PROTECTED_SCOPES=tuple(GIT_ORG+'/'+repo_slug(url).split('/')[-1] for url in (GITOPS_REPO_URL,WORKLOADS_REPO_URL))

      def github(path, method='GET', body=None):
          request=urllib.request.Request('https://api.github.com'+path, method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                       'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                       'User-Agent':'box1-tekton'})
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  data=response.read()
                  return json.loads(data) if data else None
          except urllib.error.HTTPError as error:
              detail=json.loads(error.read())
              raise RuntimeError('GitHub API %s %s: %s %s' % (method,path,error.code,detail.get('message',''))) from None

      import hashlib, io, pathlib, subprocess, zipfile
      ZERO='sha256:'+'0'*64
      PROFILE_LABEL='box1.org/workload-profile'
      # vm-instance source OS image repositories (box1-docs#139). An instance's VirtualMachine
      # names its source in box1.org/source-image and boots box1-ci/<source>-disk@sha256.
      # Adding a source is a reviewed box1-gitops PR that edits this tuple.
      VM_INSTANCE_SOURCES=('site-gateway-os',)
      INLINE_CLOUD_INIT=['userData','userDataBase64','networkData','networkDataBase64']
      # The <instance>-site ConfigMap (box1-docs#140): only these keys, each with its pattern.
      # The assembly script (box1-docs scripts/vm-cloud-init) applies the same allowlist. URLs
      # carry no user info, query, spaces, quotes or '$', so site.env stays safe to source.
      _SITE_PATH=r'(?:/[A-Za-z0-9._%+:-]*)*'
      SITE_KEYS={'siteId':(True,r'[a-z][a-z0-9_]{1,62}'),
                 'keycloakClientId':(True,r'[a-z][a-z0-9-]{1,62}'),
                 'keycloakTokenUrl':(True,r'https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?'+_SITE_PATH),
                 'assetServiceUrl':(False,r'https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?'+_SITE_PATH),
                 'kafkaBootstrapServers':(False,r'[A-Za-z0-9.-]+:[0-9]{1,5}(?:,[A-Za-z0-9.-]+:[0-9]{1,5})*'),
                 'otlpEndpoint':(False,r'https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?'+_SITE_PATH)}
      # Secret keys KubeVirt reads as cloud-init user or network data.
      CLOUD_INIT_SECRET_KEYS={'userdata','userData','networkdata','networkData'}
      CREDENTIAL_WORDS={'secret','secrets','password','passwords','passwd','pwd','passphrase',
                        'token','tokens','key','keys','apikey','privatekey','credential','credentials','kubeconfig'}
      # A credential assigned inside a file-shaped ConfigMap value (PASSWORD=..., secret: ...).
      EMBEDDED_CREDENTIAL=r'(?i)(password|passwd|pwd|secret|token|api[_-]?key|credentials?)["\']?[ \t]*[:=][ \t]*\S'
      # PaC Repository fields a ci/ bundle may set; anything else (params, git_provider, policy...) fails.
      CI_REPOSITORY_SPEC=['concurrency_limit','settings','url']
      CI_REPOSITORY_SETTINGS=['github_app_token_scope_repos','pipelinerun_provenance']
      # Role subresources that act on a workload or mint credentials, even by name.
      CI_FORBIDDEN_SUBRESOURCES=['exec','attach','portforward','proxy','token']
      # ci/<repo>/ bundles (box1-docs#137): the PaC Repository of a code-only repository and
      # its box1-ci RBAC. Kind -> required apiVersion.
      CI_KINDS={'Repository':'pipelinesascode.tekton.dev/v1alpha1','ServiceAccount':'v1',
                'ImageStream':'image.openshift.io/v1','Role':'rbac.authorization.k8s.io/v1',
                'RoleBinding':'rbac.authorization.k8s.io/v1'}
      CI_NAMESPACE='box1-ci'
      CI_OBSERVER='ci-observe'

      def documents(rendered):
          """Split rendered Kustomize output into (kind, name, text) documents."""
          docs=[]
          for text in re.split(r'(?m)^---\n',rendered):
              kind=re.search(r'(?m)^kind: (\S+)$',text)
              name=re.search(r'(?m)^  name: (\S+)$',text)
              if kind: docs.append((kind.group(1),name.group(1) if name else '',text))
          return docs

      def unquote(value):
          value=value.strip()
          return value[1:-1] if len(value)>=2 and value[0]==value[-1] and value[0] in '"\'' else value

      def section(text, key):
          """Lines nested under a top-level key of one kustomize-rendered (normalised) document."""
          found=re.search(r'(?m)^'+re.escape(key)+r':\n((?:[ -].*(?:\n|$))*)',text)
          return found.group(1) if found else ''

      def scalar(text, key):
          """A two-space-indented scalar, e.g. scalar(section(t,'metadata'),'namespace')."""
          found=re.search(r'(?m)^  '+re.escape(key)+r': (.+)$',text)
          return unquote(found.group(1)) if found else None

      def sequence(text, key):
          """A two-space-indented block list of scalars, as kustomize renders it."""
          found=re.search(r'(?m)^  '+re.escape(key)+r':\n((?:  - .*(?:\n|$))*)',text)
          return [unquote(v) for v in re.findall(r'(?m)^  - (.*)$',found.group(1))] if found else []

      def nested(text, key):
          """A two-space-indented mapping inside a section, re-indented to two spaces."""
          found=re.search(r'(?m)^  '+re.escape(key)+r':\n((?:   .*(?:\n|$))*)',text)
          return re.sub(r'(?m)^  ','',found.group(1)) if found else ''

      def keys(text):
          """The two-space-indented keys of a section."""
          return re.findall(r'(?m)^  ([^\s:#-][^\s:]*):',text)

      def entries(text):
          """Split a top-level block list (rules:, subjects:) into items with two-space keys."""
          return ['  '+item for item in re.split(r'(?m)^- ',text)[1:]]

      def profile_of(rendered):
          namespaces=[t for k,_,t in documents(rendered) if k=='Namespace']
          labels=[m.group(1) for t in namespaces for m in [re.search(r'(?m)^    '+re.escape(PROFILE_LABEL)+r': (\S+)$',t)] if m]
          profile=labels[0] if labels else 'service'
          assert profile in PROFILE_CHECKS, 'Unknown workload profile '+profile
          return profile

      def check_service(name, rendered):
          expected=r'image-registry\.openshift-image-registry\.svc:5000/box1-ci/'+name+r'@sha256:[a-f0-9]{64}'
          images=re.findall(r'^\s+image: (.+)$',rendered,re.M)
          runtime_images=[image for image in images if re.fullmatch(expected,image)]
          assert len(runtime_images)==1, 'Runtime image must be digest-pinned exactly once to its service in box1 registry'
          for kind in ['Deployment','Service','Route','ConfigMap','ServiceAccount','Namespace']:
              assert 'kind: '+kind+'\n' in rendered, 'Missing '+kind
          for probe in ['startupProbe:','readinessProbe:','livenessProbe:']:
              assert probe in rendered
          if runtime_images[0].endswith('@sha256:'+'0'*64):
              assert re.search(r'^  replicas: 0$',rendered,re.M), 'Unbuilt onboarding workloads must stay at zero replicas'

      def check_vm(name, rendered, disk_image=None):
          docs=documents(rendered)
          kinds=[k for k,_,_ in docs]
          for kind in ['Namespace','ServiceAccount','Secret','VirtualMachine']:
              assert kind in kinds, 'Missing '+kind
          for kind in ['Deployment','StatefulSet','DaemonSet','Pod']:
              assert kind not in kinds, 'Virtual machine workloads must not include '+kind
          assert not re.findall(r'^\s+image: ',rendered,re.M), 'Virtual machine workloads must not run container images'
          vms=[t for k,n,t in docs if k=='VirtualMachine']
          assert len(vms)==1 and [n for k,n,_ in docs if k=='VirtualMachine']==[name], 'Exactly one VirtualMachine named after the workload'
          vm=vms[0]
          os_digest=re.findall(r'(?m)^    box1\.org/os-image-digest: (sha256:[a-f0-9]{64})$',vm)
          assert len(os_digest)==1, 'VirtualMachine must record box1.org/os-image-digest exactly once'
          assert re.search(r'(?m)^    box1\.org/source-revision: [a-f0-9]{40}$',vm), 'VirtualMachine must record box1.org/source-revision'
          strategy=re.findall(r'(?m)^  runStrategy: (\S+)$',vm)
          assert len(strategy)==1, 'VirtualMachine must set spec.runStrategy'
          assert not re.search(r'(?m)^  dataVolumeTemplates:',vm), 'Use a separate DataVolume; dataVolumeTemplates keep placeholder sources'
          for serial in ['serviceca','regtoken']:
              assert re.search(r'(?m)^ +serial: '+serial+'$',vm), 'VirtualMachine is missing the '+serial+' disk for bootc updates'
          assert re.search(r'(?m)^ +(- )?dataVolume:\n +name: '+re.escape(name)+r'-root$',vm), 'Root disk must use DataVolume '+name+'-root'
          tokens=[t for k,_,t in docs if k=='Secret' and 'type: kubernetes.io/service-account-token' in t]
          assert tokens, 'Missing the updater service-account token Secret'
          for t in tokens:
              assert not re.search(r'(?m)^(data|stringData):',t), 'Service-account token Secrets must not carry data in Git'
          for t in [t for k,_,t in docs if k=='Secret' and t not in tokens]:
              values=re.findall(r'(?m)^  [A-Za-z0-9_.-]+: (.+)$',t.split('stringData:',1)[1]) if 'stringData:' in t else []
              assert 'stringData:' in t and not re.search(r'(?m)^data:',t) and values and all(re.fullmatch(r'"?(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|ssh-rsa) [A-Za-z0-9+/=]+( [^"]*)?"?',v) for v in values), 'Only SSH public keys may be stored in Secrets'
          dvs=[t for k,_,t in docs if k=='DataVolume']
          disk_image=disk_image or name
          disk=r'docker://image-registry\.openshift-image-registry\.svc:5000/box1-ci/'+re.escape(disk_image)+r'-disk@(sha256:[a-f0-9]{64})'
          if os_digest[0]==ZERO:
              assert strategy[0]=='Halted', 'Unbuilt virtual machines must stay Halted'
              assert not dvs, 'Unbuilt virtual machines must not create their DataVolume yet'
          else:
              assert len(dvs)==1, 'Promoted virtual machines need exactly one root DataVolume'
              urls=re.findall(r'(?m)^ +url: (\S+)$',dvs[0])
              assert len(urls)==1 and re.fullmatch(disk,urls[0]) and not urls[0].endswith(ZERO), 'Root DataVolume must pull the digest-pinned '+disk_image+'-disk image'
              assert re.search(r'(?m)^ +pullMethod: node$',dvs[0]), 'Root DataVolume must use pullMethod: node'

      def credential_keys(text, allowed=()):
          """ConfigMap data keys that look like credentials (clientSecret, admin_password, apiKey...).

          Keys are split into words (camelCase, -, _, .), so keycloakUrl is not a key. Keys in
          `allowed` (the #140 site keys, such as keycloakTokenUrl) skip the key-name test only;
          their values are still checked.
          """
          found=[]
          for key in re.findall(r'(?m)^  [\'"]?([-._A-Za-z0-9]+)[\'"]?:',section(text,'data')+section(text,'binaryData')):
              words=re.split(r'[-_.]+',re.sub(r'([a-z0-9])([A-Z])',r'\1_\2',key).lower())
              if key in allowed: continue
              if CREDENTIAL_WORDS.intersection(words) or 'apikey' in key.lower(): found.append(key)
          if re.search(r'-----BEGIN [A-Z ]*PRIVATE KEY-----',text): found.append('a PEM private key value')
          embedded=re.search(EMBEDDED_CREDENTIAL,section(text,'data')+section(text,'binaryData'))
          if embedded: found.append('an embedded '+embedded.group(1)+' assignment in a value')
          return found

      def check_vm_instance(name, rendered):
          """One instance of a shared bootc OS image (box1-docs#139), identity by cloud-init (#140)."""
          docs=documents(rendered)
          names=[n for k,n,_ in docs if k=='VirtualMachine']
          assert names==[name], 'Exactly one VirtualMachine must be named after the instance %s; found %s' % (name,', '.join(names) or 'none')
          vm=[t for k,_,t in docs if k=='VirtualMachine'][0]
          sources=[unquote(v) for v in re.findall(r'(?m)^    box1\.org/source-image: (.+)$',vm)]
          assert len(sources)==1, 'VM instance must record its source OS image repository in box1.org/source-image exactly once'
          source=sources[0]
          assert source in VM_INSTANCE_SOURCES, 'Source image %s is not on the vm-instance allowlist (VM_INSTANCE_SOURCES in box1-gitops gitops-validate.yaml): %s' % (source,', '.join(VM_INSTANCE_SOURCES))
          for key in INLINE_CLOUD_INIT:
              assert not re.search(r'(?m)^ +(- )?'+key+r':',vm), 'VM instances must not inline '+key+'; reference the '+name+'-cloud-init Secret with cloudInitNoCloud.secretRef'
          volumes=list(re.finditer(r'(?m)^( +)(- )?cloudInitNoCloud:\n',vm))
          assert len(volumes)==1, 'VM instance needs exactly one cloudInitNoCloud volume with secretRef.name: '+name+'-cloud-init'
          column=len(volumes[0].group(1))+len(volumes[0].group(2) or '')
          nested=re.match(r'((?:'+' '*(column+1)+r' *\S.*(?:\n|$))*)',vm[volumes[0].end():]).group(1)
          refs=dict(re.findall(r'(?m)^ +(secretRef|networkDataSecretRef):\n +name: (\S+)$',nested))
          assert refs.get('secretRef')==name+'-cloud-init', 'cloudInitNoCloud must use secretRef.name: '+name+'-cloud-init'
          rendered_secrets={n for k,n,_ in docs if k=='Secret'}
          for ref in refs.values():
              assert ref not in rendered_secrets, 'Secret '+ref+' must be created outside Git, not rendered from it: cloud-init userData carries the instance credential'
          for _,n,t in [d for d in docs if d[0]=='ConfigMap']:
              leaked=credential_keys(t, SITE_KEYS if n==name+'-site' else ())
              assert not leaked, 'ConfigMap '+n+' must not hold credentials; found '+', '.join(leaked)+'. Put credentials in the '+name+'-cloud-init Secret, created outside Git'
          dvs=[n for k,n,_ in docs if k=='DataVolume']
          assert all(n==name+'-root' for n in dvs), 'Root DataVolume must be named '+name+'-root; found '+', '.join(dvs)
          check_instance_cloud_init(name, docs, vm)
          check_instance_rbac(name, docs)
          check_vm(name, rendered, disk_image=source)

      def block_items(text, key):
          """Items of the first block list under `key:` (kustomize renders `- ` at the key's column).

          Each item is returned with its own keys at column 0.
          """
          found=re.search(r'(?m)^( *)'+re.escape(key)+r':\n',text)
          if not found: return []
          indent=found.group(1); items=[]
          for line in text[found.end():].splitlines():
              if line.startswith(indent+'- '): items.append(line[len(indent)+2:]+'\n')
              elif line.startswith(indent+'  ') and items: items[-1]+=line[len(indent)+2:]+'\n'
              else: break
          return items

      def rendered_rules(rules):
          """A Role's rules as kustomize renders them (keys sorted, block lists)."""
          out=''
          for rule in rules:
              lines=[]
              for key in sorted(rule):
                  lines.append(key+':')
                  lines+=['- '+('""' if v=='' else v) for v in rule[key]]
              out+='- '+lines[0]+'\n'+''.join('  '+l+'\n' for l in lines[1:])
          return out

      def check_instance_rbac(name, docs):
          """vm-instance RBAC is exactly what the template generates (box1-docs#138 review).

          The Hub may get one Secret (the cloud-init check) and ci-vm-deploy may port-forward
          to one VMI (the booted-digest check); both rely on these Roles staying this narrow.
          """
          ns=name+'-dev'
          roles={(name+'-release-observer',ns):[{'apiGroups':['kubevirt.io'],'resources':['virtualmachines','virtualmachineinstances'],'resourceNames':[name],'verbs':['get']},
                                               {'apiGroups':['cdi.kubevirt.io'],'resources':['datavolumes'],'resourceNames':[name+'-root'],'verbs':['get']}],
                 (name+'-release-observer','openshift-gitops'):[{'apiGroups':['argoproj.io'],'resources':['applications'],'resourceNames':[name],'verbs':['get']}],
                 (name+'-cloud-init-observer',ns):[{'apiGroups':[''],'resources':['secrets'],'resourceNames':[name+'-cloud-init'],'verbs':['get']}],
                 (name+'-status-reader',ns):[{'apiGroups':['kubevirt.io'],'resources':['virtualmachineinstances'],'resourceNames':[name],'verbs':['get']},
                                            {'apiGroups':['subresources.kubevirt.io'],'resources':['virtualmachineinstances/portforward'],'resourceNames':[name],'verbs':['get','update']}]}
          subjects={(name+'-image-puller','box1-ci'):('ClusterRole','system:image-puller','- apiGroup: rbac.authorization.k8s.io\n  kind: Group\n  name: system:serviceaccounts:'+ns+'\n'),
                    (name+'-release-observer',ns):('Role',name+'-release-observer','- kind: ServiceAccount\n  name: ci-observe\n  namespace: box1-ci\n'),
                    (name+'-release-observer','openshift-gitops'):('Role',name+'-release-observer','- kind: ServiceAccount\n  name: ci-observe\n  namespace: box1-ci\n'),
                    (name+'-cloud-init-observer',ns):('Role',name+'-cloud-init-observer','- kind: ServiceAccount\n  name: developer-hub-onboarding\n  namespace: rhdh\n'),
                    (name+'-status-reader',ns):('Role',name+'-status-reader','- kind: ServiceAccount\n  name: ci-vm-deploy\n  namespace: box1-ci\n')}
          for kind,n,t in docs:
              assert kind not in ('ClusterRole','ClusterRoleBinding'), 'VM instances must not create '+kind+' '+n
              if kind not in ('Role','RoleBinding'): continue
              key=(n,scalar(section(t,'metadata'),'namespace'))
              if kind=='Role':
                  assert key in roles and section(t,'rules')==rendered_rules(roles[key]), 'Role %s in %s is not one of the generated vm-instance Roles, exactly as generated' % key
              else:
                  assert key in subjects, 'RoleBinding %s in %s is not one of the generated vm-instance bindings' % key
                  ref_kind,ref_name,subject=subjects[key]
                  ref=section(t,'roleRef')
                  assert scalar(ref,'kind')==ref_kind and scalar(ref,'name')==ref_name and section(t,'subjects')==subject, 'RoleBinding %s in %s must bind exactly its generated Role and subject' % key

      def check_instance_cloud_init(name, docs, vm):
          """The #140 instance bundle rules that #139's first cut left open (box1-docs#138)."""
          for key in ['accessCredentials','volumes','disks']:
              count=len(re.findall(r'(?m)^ +'+key+r':$',vm))
              assert count==1, 'The VirtualMachine must have exactly one '+key+' block; found '+str(count)
          volumes=block_items(vm,'volumes')
          cloud=[v for v in volumes if re.search(r'(?m)^cloudInit(NoCloud|ConfigDrive):',v)]
          assert len(cloud)==1 and re.search(r'(?m)^name: cloudinitdisk$',cloud[0]), 'The only cloud-init volume must be named cloudinitdisk'
          assert not re.search(r'(?m)^cloudInitConfigDrive:',cloud[0]), 'VM instances must not use cloudInitConfigDrive; use the cloudinitdisk NoCloud volume'
          assert cloud[0]=='cloudInitNoCloud:\n  secretRef:\n    name: '+name+'-cloud-init\nname: cloudinitdisk\n', \
                 'cloudInitNoCloud must set only secretRef.name: '+name+'-cloud-init (no networkDataSecretRef or other keys)'
          disks=block_items(vm,'disks')
          assert any(re.search(r'(?m)^name: cloudinitdisk$',d) for d in disks), 'VM instance needs a disk named cloudinitdisk for the NoCloud volume'
          for serial in re.findall(r'(?m)^ +serial: (.+)$',vm):
              assert not unquote(serial).startswith('ds='), 'VM instances must not set a ds= SMBIOS or disk serial: cloud-init would take its datasource from it'
          assert not re.search(r'(?m)^ +(noCloud|configDrive):',vm), 'accessCredentials must use qemuGuestAgent; noCloud and configDrive propagation are refused'
          for credential in block_items(vm,'accessCredentials'):
              assert not re.search(r'(?m)^ +(noCloud|configDrive):',credential), 'accessCredentials must use qemuGuestAgent; noCloud and configDrive propagation are refused'
              users=re.findall(r'(?m)^ +- (\S+)$',credential.split('users:',1)[1]) if 'users:' in credential else []
              assert re.search(r'(?m)^ +qemuGuestAgent:$',credential) and users==['cloud-user'], 'accessCredentials may only propagate keys to cloud-user through qemuGuestAgent'
          for kind,n,t in docs:
              if kind!='Secret': continue
              stored=re.findall(r'(?m)^  [\'"]?([-._A-Za-z0-9]+)[\'"]?:',section(t,'data')+section(t,'stringData'))
              found=CLOUD_INIT_SECRET_KEYS.intersection(stored)
              assert not found, 'Secret '+n+' must not hold cloud-init '+', '.join(sorted(found))+' in Git; the '+name+'-cloud-init Secret is assembled outside Git'
          sites=[t for k,n,t in docs if k=='ConfigMap' and n==name+'-site']
          assert len(sites)==1, 'VM instance needs exactly one ConfigMap '+name+'-site with its siteId and endpoints'
          site=sites[0]
          labels=[unquote(v) for v in re.findall(r'(?m)^    box1\.org/instance: (.+)$',site)]
          assert labels==[name], 'ConfigMap '+name+'-site must be labelled box1.org/instance: '+name
          assert not re.search(r'(?m)^binaryData:',site), 'ConfigMap '+name+'-site must not have binaryData'
          lines=section(site,'data').splitlines()
          data={}
          for line in lines:
              entry=re.fullmatch(r'  [\'"]?([-._A-Za-z0-9]+)[\'"]?: (.+)',line)
              assert entry and not re.match(r'[|>]',entry.group(2)), 'ConfigMap '+name+'-site values must be single-line scalars'
              data[entry.group(1)]=unquote(entry.group(2))
          unknown=sorted(set(data)-set(SITE_KEYS))
          assert not unknown, 'ConfigMap '+name+'-site may only hold '+', '.join(SITE_KEYS)+'; found '+', '.join(unknown)
          for key,(required,pattern) in SITE_KEYS.items():
              if key not in data:
                  assert not required, 'ConfigMap '+name+'-site must set '+key
              else:
                  assert re.fullmatch(pattern,data[key]), 'ConfigMap '+name+'-site '+key+' does not match the #140 pattern '+pattern

      def check_ci_role(repo, role, text):
          rules=entries(section(text,'rules'))
          assert rules, 'Role %s must declare rules' % role
          for rule in rules:
              groups,resources,names,verbs=[sequence(rule,key) for key in ['apiGroups','resources','resourceNames','verbs']]
              assert not any('*' in r for r in groups+resources+names+verbs), 'Role %s must not use wildcards' % role
              assert not any(r.split('/')[0]=='secrets' for r in resources), 'Role %s must not grant access to Secrets' % role
              assert not any(r.split('/')[-1] in CI_FORBIDDEN_SUBRESOURCES for r in resources if '/' in r), 'Role %s must not grant %s subresources' % (role,'/'.join(CI_FORBIDDEN_SUBRESOURCES))
              assert names, 'Role %s must name its resources (resourceNames) in every rule' % role
              push=resources==['imagestreams/layers'] and names==[repo+'-bundle'] and set(verbs)<={'get','update'}
              assert verbs and (set(verbs)<={'get','list','watch'} or push), ('Role %s grants %s on %s; CI bundle Roles may only get, list or watch '
                  'named resources, and get or update imagestreams/layers of %s-bundle' % (role,', '.join(verbs) or 'nothing',', '.join(resources),repo))

      def check_ci(repo, rendered):
          """ci/<repo>/: the PaC Repository of a code-only repository and its scoped box1-ci RBAC (box1-docs#137)."""
          assert re.fullmatch('[a-z][a-z0-9-]{2,39}',repo), 'Invalid CI bundle name '+repo
          where='ci/'+repo
          docs=documents(rendered)
          for kind,n,t in docs:
              assert kind in CI_KINDS, 'CI bundle %s may contain only %s; found %s %s' % (where,', '.join(sorted(CI_KINDS)),kind,n)
              api=re.search(r'(?m)^apiVersion: (\S+)$',t)
              assert api and api.group(1)==CI_KINDS[kind], '%s %s in %s must use apiVersion %s' % (kind,n,where,CI_KINDS[kind])
              assert scalar(section(t,'metadata'),'namespace')==CI_NAMESPACE, 'CI bundle resources must be in namespace box1-ci: %s/%s' % (kind,n)
          repositories=[t for k,_,t in docs if k=='Repository']
          assert [n for k,n,_ in docs if k=='Repository']==[repo], 'CI bundle %s must declare exactly one PaC Repository named %s' % (where,repo)
          expected_url='https://'+GIT_HOST+'/'+GIT_ORG+'/'+repo
          assert scalar(section(repositories[0],'spec'),'url')==expected_url, 'PaC Repository %s must point at %s' % (repo,expected_url)
          spec=section(repositories[0],'spec'); settings=nested(spec,'settings')
          assert set(keys(spec))<=set(CI_REPOSITORY_SPEC), 'PaC Repository %s spec may set only %s; found %s' % (repo,', '.join(CI_REPOSITORY_SPEC),', '.join(keys(spec)))
          assert set(keys(settings))<=set(CI_REPOSITORY_SETTINGS), 'PaC Repository %s settings may set only %s; found %s' % (repo,', '.join(CI_REPOSITORY_SETTINGS),', '.join(keys(settings)))
          assert scalar(settings,'pipelinerun_provenance')=='default_branch', 'PaC Repository %s must set settings.pipelinerun_provenance: default_branch' % repo
          for scope in sequence(settings,'github_app_token_scope_repos'):
              assert re.fullmatch(re.escape(GIT_ORG)+'/[a-z][a-z0-9-]{2,39}',scope) and scope not in PROTECTED_SCOPES, (
                  'PaC Repository %s github_app_token_scope_repos may list only %s consumer repositories, not %s: a code-only repository deploys nothing' % (repo,GIT_ORG,scope))
          for kind,n,_ in docs:
              if kind=='ImageStream': assert n==repo+'-bundle', 'ImageStream must be named %s-bundle; found %s' % (repo,n)
              elif kind!='Repository': assert n.startswith(repo+'-'), '%s %s in %s must be named %s-<purpose>' % (kind,n,where,repo)
          accounts={n for k,n,_ in docs if k=='ServiceAccount'}|{CI_OBSERVER}
          roles={n for k,n,_ in docs if k=='Role'}
          for kind,n,t in docs:
              if kind=='Role': check_ci_role(repo,n,t)
              if kind!='RoleBinding': continue
              ref=section(t,'roleRef')
              assert scalar(ref,'kind')=='Role' and scalar(ref,'name') in roles and scalar(ref,'apiGroup')=='rbac.authorization.k8s.io', 'RoleBinding %s must reference a Role declared in %s' % (n,where)
              subjects=entries(section(t,'subjects'))
              assert subjects, 'RoleBinding %s must name its subjects' % n
              for subject in subjects:
                  assert scalar(subject,'kind')=='ServiceAccount' and scalar(subject,'namespace')==CI_NAMESPACE and scalar(subject,'name') in accounts, (
                      'RoleBinding %s may bind only ServiceAccounts declared in %s or box1-ci/%s; found %s %s' % (n,where,CI_OBSERVER,scalar(subject,'kind'),scalar(subject,'name')))

      PROFILE_CHECKS={'service':check_service,'virtual-machine':check_vm,'vm-instance':check_vm_instance}
      PASS_MESSAGES={'service':'PASS: Kustomize, resources, probes, immutable image: ',
                     'virtual-machine':'PASS: Kustomize, VirtualMachine, pinned OS and disk digests, update disks: ',
                     'vm-instance':'PASS: Kustomize, VM instance of an allowlisted source, pinned OS and disk digests, cloud-init by reference: '}

      def validate(name, rendered):
          assert re.fullmatch('[a-z][a-z0-9-]{2,39}',name)
          profile=profile_of(rendered)
          PROFILE_CHECKS[profile](name, rendered)
          return profile

      def validation_targets(checkout):
          """Kustomizations to validate: every workloads/*/ and every ci/*/ (box1-docs#137)."""
          workloads=sorted((checkout/'workloads').glob('*/kustomization.yaml'))
          assert workloads, 'No workload targets found'
          ci=sorted((checkout/'ci').glob('*/kustomization.yaml'))
          for target in ci:
              repo=target.parent.name
              assert not (checkout/'workloads'/repo).exists(), 'ci/%s collides with workloads/%s: a repository has one PaC Repository' % (repo,repo)
          return workloads, ci

      if __name__=='__main__':
          sha=os.environ['REVISION']; assert re.fullmatch('[a-f0-9]{40}',sha)
          req=urllib.request.Request('https://api.github.com/repos/'+repo_slug(WORKLOADS_REPO_URL)+'/zipball/'+sha,
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'box1-gitops-validator'})
          with urllib.request.urlopen(req,timeout=60) as response: archive=zipfile.ZipFile(io.BytesIO(response.read()))
          root=pathlib.Path('/tmp/gitops-validation'); root.mkdir()
          for entry in archive.infolist():
              p=pathlib.PurePosixPath(entry.filename)
              assert not p.is_absolute() and '..' not in p.parts
          archive.extractall(root)
          checkout=next(root.iterdir())
          url='https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl'
          with urllib.request.urlopen(url,timeout=60) as response: binary=response.read()
          with urllib.request.urlopen(url+'.sha256',timeout=30) as response: expected=response.read().decode().strip()
          assert hashlib.sha256(binary).hexdigest()==expected
          kubectl=root/'kubectl'; kubectl.write_bytes(binary); kubectl.chmod(0o755)
          targets,ci_targets=validation_targets(checkout)
          for target in targets:
              name=target.parent.name
              rendered=subprocess.check_output([str(kubectl),'kustomize',str(target.parent)],text=True)
              profile=validate(name, rendered)
              print(PASS_MESSAGES[profile]+name)
          for target in ci_targets:
              repo=target.parent.name
              check_ci(repo, subprocess.check_output([str(kubectl),'kustomize',str(target.parent)],text=True))
              print('PASS: Kustomize, PaC Repository and scoped box1-ci RBAC only: ci/'+repo)
          print('Validated '+str(len(targets))+' workloads at '+sha)
          if ci_targets: print('Validated '+str(len(ci_targets))+' CI bundles at '+sha)
