---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: box1-quarkus-maven
  namespace: box1-ci
spec:
  params:
  - name: revision
    type: string
    default: ''
  - name: source-repo
    type: string
    default: ''
    description: owner/name of the source repository; empty means <BOX1_GIT_ORG>/quarkus-reference (box1-org/quarkus-reference on the homelab).
  - name: git-auth-secret
    type: string
    default: ''
  - name: push-image
    type: string
    default: 'false'
  - name: image-name
    type: string
    default: quarkus-reference
  steps:
  - name: fetch
    # box1-org/box1-build builder image: Maven 3.9.16, Python 3.11, Maven settings
    # (mirror: in-cluster Reposilite) and a baked Maven cache at /opt/box1/m2 (box1-docs#113).
    image: image-registry.openshift-image-registry.svc:5000/box1-build/box1-builder@sha256:358c338ab8f5972dba2886e35ae7b0804c48abbcbe639a687b7587f09d7ca79e
    env:
    - name: HOME
      value: "/tekton/home"
    - name: REVISION
      value: "$(params.revision)"
    - name: SOURCE_REPO
      value: "$(params.source-repo)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: "$(params.git-auth-secret)"
          key: git-provider-token
    # Optional cluster/org settings (RHDP); absent on the homelab, so the defaults apply.
    envFrom:
    - configMapRef:
        name: box1-platform-settings
        optional: true
    volumeMounts:
    - name: source
      mountPath: "/workspace"
    script: |
      #!/usr/bin/env python3
      import hashlib, io, os, pathlib, re, shutil, urllib.request, zipfile
      org=os.environ.get('BOX1_GIT_ORG','box1-org')
      revision=os.environ['REVISION']; repo=os.environ['SOURCE_REPO'] or org+'/quarkus-reference'
      assert re.fullmatch('[a-f0-9]{40}',revision), 'Immutable source SHA required'
      assert re.fullmatch(re.escape(org)+'/[a-z0-9-]+',repo), 'Source repository outside '+org
      req=urllib.request.Request('https://api.github.com/repos/'+repo+'/zipball/'+revision,
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'box1-tekton'})
      with urllib.request.urlopen(req,timeout=60) as response:
          archive=zipfile.ZipFile(io.BytesIO(response.read()))
      root=pathlib.Path('/workspace'); unpack=root/'unpack'
      for entry in archive.infolist():
          path=pathlib.PurePosixPath(entry.filename)
          assert not path.is_absolute() and '..' not in path.parts, 'Unsafe source archive'
      archive.extractall(unpack)
      folders=list(unpack.iterdir()); assert len(folders)==1
      shutil.move(str(folders[0]),str(root/'application'))
      print('Fetched '+repo+' at '+revision+'; builder '+open('/opt/box1/release').read().replace('\n',' '))
  - name: verify-and-publish
    image: image-registry.openshift-image-registry.svc:5000/box1-build/box1-builder@sha256:358c338ab8f5972dba2886e35ae7b0804c48abbcbe639a687b7587f09d7ca79e
    workingDir: "/workspace"
    computeResources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 3Gi
    env:
    - name: HOME
      value: "/tekton/home"
    - name: MAVEN_OPTS
      value: "-Xmx1024m -Duser.home=/tekton/home"
    - name: REVISION
      value: "$(params.revision)"
    - name: PUSH_IMAGE
      value: "$(params.push-image)"
    - name: IMAGE_NAME
      value: "$(params.image-name)"
    # Optional cluster/org settings (RHDP); absent on the homelab, so the defaults apply.
    envFrom:
    - configMapRef:
        name: box1-platform-settings
        optional: true
    volumeMounts:
    - name: source
      mountPath: "/workspace"
    script: |
      #!/bin/sh
      set -eu
      cd /workspace/application
      # The image's baked cache is a read-only tail: cached artifacts are read
      # from it, anything new is fetched through Reposilite into /workspace/m2.
      mvn -B -ntp -s "$BOX1_MAVEN_SETTINGS" -Dmaven.repo.local=/workspace/m2 -Dmaven.repo.local.tail="$BOX1_MAVEN_TAIL" verify -DskipITs=false
      # -ntp hides per-artifact transfers; record what the baked cache did not cover.
      printf 'Fetched beyond the baked cache: %s jars, ' "$(find /workspace/m2 -name '*.jar' 2>/dev/null | wc -l)"
      du -sh /workspace/m2 2>/dev/null | cut -f1 || echo 0
      # The PR service account has no API token. Only trusted main builds publish.
      if [ "$PUSH_IMAGE" = true ]; then
        export QUARKUS_CONTAINER_IMAGE_USERNAME=serviceaccount
        export QUARKUS_CONTAINER_IMAGE_PASSWORD="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
        mvn -B -ntp -s "$BOX1_MAVEN_SETTINGS" -Dmaven.repo.local=/workspace/m2 -Dmaven.repo.local.tail="$BOX1_MAVEN_TAIL" package -DskipTests \
          -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true \
          -Dquarkus.container-image.registry="${BOX1_REGISTRY_HOST:-registry.apps.ocp.box1.org}" \
          -Dquarkus.container-image.group=box1-ci -Dquarkus.container-image.name="$IMAGE_NAME" \
          -Dquarkus.container-image.tag="$REVISION"
        unset QUARKUS_CONTAINER_IMAGE_PASSWORD
        grep -Eq '^sha256:[a-f0-9]{64}$' target/jib-image.digest
        tr -d '\n' < target/jib-image.digest > "$(results.image-digest.path)"
        printf 'Published digest: '; cat target/jib-image.digest
      else
        printf 'not-published' > "$(results.image-digest.path)"
      fi
  results:
  - name: image-digest
    type: string
  volumes:
  - name: source
    emptyDir: {}
