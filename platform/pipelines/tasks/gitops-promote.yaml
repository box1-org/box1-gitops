---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: box1-gitops-promote
  namespace: box1-ci
spec:
  params:
  - name: revision
    type: string
    default: ''
  - name: image-digest
    type: string
    default: ''
  - name: git-auth-secret
    type: string
    default: ''
  - name: environment
    type: string
    default: approval
  - name: pipeline-run
    type: string
    default: ''
  - name: application-name
    type: string
    default: quarkus-reference
  - name: argo-sync-timeout
    type: string
    default: '300'
  steps:
  - name: promote
    image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
    env:
    - name: HOME
      value: "/tekton/home"
    - name: REVISION
      value: "$(params.revision)"
    - name: IMAGE_DIGEST
      value: "$(params.image-digest)"
    - name: ENVIRONMENT
      value: "$(params.environment)"
    - name: PIPELINE_RUN
      value: "$(params.pipeline-run)"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: "$(params.git-auth-secret)"
          key: git-provider-token
    - name: APPLICATION_NAME
      value: "$(params.application-name)"
    - name: ARGO_SYNC_TIMEOUT
      value: "$(params.argo-sync-timeout)"
    script: |
      #!/usr/bin/env python3
      import base64, datetime, json, os, re, ssl, time, urllib.request, urllib.error

      def github(path, method='GET', body=None):
          request=urllib.request.Request('https://api.github.com'+path, method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                       'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                       'User-Agent':'box1-tekton'})
          try:
              with urllib.request.urlopen(request,timeout=45) as response:
                  data=response.read()
                  return json.loads(data) if data else None
          except urllib.error.HTTPError as error:
              detail=json.loads(error.read())
              raise RuntimeError('GitHub API %s %s: %s %s' % (method,path,error.code,detail.get('message',''))) from None

      import pathlib
      source=os.environ['REVISION']; digest=os.environ['IMAGE_DIGEST']; environment=os.environ['ENVIRONMENT']
      assert re.fullmatch('[a-f0-9]{40}',source) and re.fullmatch('sha256:[a-f0-9]{64}',digest)
      assert environment in ['development','approval'], 'Unsupported promotion policy'
      name=os.environ['APPLICATION_NAME']
      assert re.fullmatch('[a-z][a-z0-9-]{2,39}',name), 'Invalid application name'
      application='/repos/box1-org/'+name
      gitops='/repos/box1-org/box1-workloads-dev'

      def result(name,value): pathlib.Path('/tekton/results/'+name).write_text(str(value))

      def kube(path, method='GET', body=None):
          account=pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount')
          token=(account/'token').read_text().strip()
          context=ssl.create_default_context(cafile=str(account/'ca.crt'))
          request=urllib.request.Request('https://kubernetes.default.svc'+path, method=method,
              data=None if body is None else json.dumps(body).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/merge-patch+json'})
          try:
              with urllib.request.urlopen(request, context=context, timeout=30) as response:
                  text=response.read(); return json.loads(text) if text else None
          except urllib.error.HTTPError as error:
              detail=error.read().decode(errors='replace')
              raise RuntimeError('Kubernetes %s %s failed: HTTP %s %s' % (method,path,error.code,detail[:500])) from None

      def when(value):
          if not value: return 0
          return datetime.datetime.fromisoformat(value.replace('Z','+00:00')).timestamp()

      def diagnostics(app, expected, phase=''):
          status=app.get('status',{}); operation=status.get('operationState') or {}
          sync=status.get('sync') or {}; health=status.get('health') or {}
          messages=[]
          for condition in status.get('conditions') or []:
              if condition.get('message'): messages.append(condition['message'])
          if operation.get('message'): messages.append(operation['message'])
          return ('Argo Application %s did not reach the requested state: expected GitOps revision=%s, '
              'observed revision=%s, sync=%s, health=%s, operation phase=%s, %s' %
              (name,expected,sync.get('revision') or sync.get('revisions'),sync.get('status'),
               health.get('status'),operation.get('phase') or phase,'; '.join(messages) or 'no condition message'))

      def sync_application(expected, timeout):
          path='/apis/argoproj.io/v1alpha1/namespaces/openshift-gitops/applications/'+name
          started=time.time(); deadline=started+timeout; app=kube(path)
          spec=app.get('spec',{}); sources=spec.get('sources')
          if sources is None: sources=[spec.get('source',{})]
          direct=[source for source in sources if source.get('repoURL','').rstrip('/').removesuffix('.git')=='https://github.com/box1-org/box1-gitops']
          active=(app.get('status',{}).get('operationState') or {}).get('phase') in ['Running','Terminating']
          current=app.get('status',{}).get('sync',{}) or {}
          observed=current.get('revision') or current.get('revisions')
          if not active and current.get('status')=='Synced' and app.get('status',{}).get('health',{}).get('status')=='Healthy' and (not direct or expected in ([observed] if isinstance(observed,str) else observed or [])):
              print('Argo Application already Synced/Healthy at '+str(observed))
              return
          if active:
              print('Waiting for existing Argo operation before requesting '+expected)
          while active and time.time()<deadline:
              time.sleep(5); app=kube(path); operation=app.get('status',{}).get('operationState') or {}; active=operation.get('phase') in ['Running','Terminating']
              if not active and operation.get('phase') not in [None,'Succeeded']:
                  raise RuntimeError(diagnostics(app,expected))
          if active: raise TimeoutError(diagnostics(app,expected,'Running'))
          current=app.get('status',{}).get('sync',{}) or {}
          observed=current.get('revision') or current.get('revisions')
          if current.get('status')=='Synced' and app.get('status',{}).get('health',{}).get('status')=='Healthy' and (not direct or expected in ([observed] if isinstance(observed,str) else observed or [])):
              print('Argo Application reached expected state while waiting: '+str(observed))
              return
          sync={}
          if len(direct)==1 and len(sources)==1: sync['revision']=expected
          elif direct:
              sync['revisions']=[expected if source in direct else source.get('targetRevision','HEAD') for source in sources]
          operation={'initiatedBy':{'username':'box1-release'},'sync':{'syncStrategy':{'hook':{}},**sync}}
          kube(path,'PATCH',{'operation':operation})
          print('Requested Argo sync for '+name+' at GitOps revision '+expected)
          request_started=time.time()
          while time.time()<deadline:
              time.sleep(5); app=kube(path); status=app.get('status',{}); operation= status.get('operationState') or {}; phase=operation.get('phase')
              if phase in ['Error','Failed','Terminating']: raise RuntimeError(diagnostics(app,expected))
              sync=status.get('sync') or {}; health=status.get('health') or {}; observed=sync.get('revision') or sync.get('revisions')
              operation_started=when(operation.get('startedAt'))
              fresh=operation_started >= request_started-5
              revision_ok=not direct or expected in ([observed] if isinstance(observed,str) else observed or [])
              if phase=='Succeeded' and fresh and sync.get('status')=='Synced' and health.get('status')=='Healthy' and revision_ok:
                  print('Argo sync completed for '+name+' at '+str(observed))
                  return
          raise TimeoutError(diagnostics(app,expected,'Running'))
      result('promoted','false'); result('gitops-revision','not-merged'); result('pr-url','not-created')
      if github(application+'/commits/main')['sha'] != source:
          print('Source revision was superseded; no promotion is performed.')
          raise SystemExit(0)
      base=github(gitops+'/git/ref/heads/main')['object']['sha']
      base_commit=github(gitops+'/git/commits/'+base)
      paths=['workloads/'+name+'/kustomization.yaml','workloads/'+name+'/deployment.yaml']
      old={}; new={}
      for path in paths:
          old[path]=base64.b64decode(github(gitops+'/contents/'+path+'?ref='+base)['content']).decode()
      new[paths[0]],count=re.subn(r'(?m)^    digest: sha256:[a-f0-9]{64}$','    digest: '+digest,old[paths[0]])
      assert count==1, 'Exactly one digest entry required'
      new[paths[1]],count=re.subn(r'(?m)^    box1\.org/source-revision: [a-f0-9]{40}$','    box1.org/source-revision: '+source,old[paths[1]])
      assert count==1, 'Source revision annotation missing'
      new[paths[1]],count=re.subn(r'(?m)^    box1\.org/build-pipelinerun: .+$','    box1.org/build-pipelinerun: box1-ci/'+os.environ['PIPELINE_RUN'],new[paths[1]])
      assert count==1
      # Activate only the unbuilt onboarding deployment; preserve later operator scaling choices.
      if 'digest: sha256:'+'0'*64 in old[paths[0]]:
          new[paths[1]],count=re.subn(r'(?m)^  replicas: 0$', '  replicas: 1', new[paths[1]])
          assert count == 1, 'Unbuilt onboarding deployment must have zero replicas'
      entries=[]
      for path in paths:
          blob=github(gitops+'/git/blobs','POST',{'content':new[path],'encoding':'utf-8'})
          entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
      tree=github(gitops+'/git/trees','POST',{'base_tree':base_commit['tree']['sha'],'tree':entries})
      commit=github(gitops+'/git/commits','POST',{'message':'Promote '+name+' '+source[:12]+' to '+environment,'tree':tree['sha'],'parents':[base]})
      branch='promote/'+name+'/' +source[:12]+'-'+os.environ['PIPELINE_RUN'][-5:]
      github(gitops+'/git/refs','POST',{'ref':'refs/heads/'+branch,'sha':commit['sha']})
      pr=github(gitops+'/pulls','POST',{'title':'Promote '+name+' '+source[:12]+' to '+environment,'head':branch,'base':'main',
          'body':'Automated Tekton promotion.\n\nEnvironment: '+environment+'\nSource: `'+source+'`\nImage digest: `'+digest+'`\nBuild: `'+os.environ['PIPELINE_RUN']+'`\n\nDevelopment may merge only after required checks pass on this exact head commit. Other environments require approval.'})
      result('pr-url',pr['html_url']); print('Created GitOps PR: '+pr['html_url'])
      if environment != 'development':
          print('Approval policy selected; PR left open for a reviewer.')
          raise SystemExit(0)
      expected_head=commit['sha']
      required=['Pipelines as Code CI / box1-phase1-smoke-','Pipelines as Code CI / box1-gitops-validate-']
      deadline=time.monotonic()+900
      while time.monotonic()<deadline:
          current=github(gitops+'/pulls/'+str(pr['number']))
          assert current['state']=='open' and current['head']['sha']==expected_head, 'GitOps PR changed during validation'
          checks=github(gitops+'/commits/'+expected_head+'/check-runs?per_page=100')['check_runs']
          selected={}
          for check in sorted(checks,key=lambda value:value['id']):
              if check['name'] in required and check['app']['slug']=='box1-pipelines': selected[check['name']]=check
          failed=[name for name,check in selected.items() if check['status']=='completed' and check['conclusion']!='success']
          assert not failed, 'Required GitOps check failed: '+', '.join(failed)
          if len(selected)==len(required) and all(c['status']=='completed' and c['conclusion']=='success' for c in selected.values()): break
          time.sleep(10)
      else: raise TimeoutError('Timed out waiting for required checks on GitOps PR')
      # Validate the full file contents again, after checks, before the exact-SHA merge.
      changed=github(gitops+'/pulls/'+str(pr['number'])+'/files?per_page=100')
      assert sorted(f['filename'] for f in changed)==sorted(paths), 'Promotion changed unexpected paths'
      for path in paths:
          actual=base64.b64decode(github(gitops+'/contents/'+path+'?ref='+expected_head)['content']).decode()
          assert actual==new[path], 'Promotion contents changed'
      if github(application+'/commits/main')['sha'] != source:
          github(gitops+'/pulls/'+str(pr['number']),'PATCH',{'state':'closed'})
          print('A newer source commit superseded this release; stale PR closed.')
          raise SystemExit(0)
      merged=github(gitops+'/pulls/'+str(pr['number'])+'/merge','PUT',{'sha':expected_head,'merge_method':'squash'})
      assert merged.get('merged'), 'GitOps merge rejected'
      print('Merged development GitOps PR after exact-head required checks: '+merged['sha'])
      sync_application(merged['sha'],int(os.environ['ARGO_SYNC_TIMEOUT']))
      result('promoted','true'); result('gitops-revision',merged['sha'])
  results:
  - name: pr-url
    type: string
  - name: gitops-revision
    type: string
  - name: promoted
    type: string
