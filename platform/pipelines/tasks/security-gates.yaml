---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: box1-security-gates
  namespace: box1-ci
  labels:
    box1.org/security-gate: image
  annotations:
    # OpenShift Pipelines console contract: the PipelineRun "View SBOM" action
    # finds the TaskRun with this key and opens its LINK_TO_SBOM result as a URL.
    # Tekton copies Task annotations onto the TaskRun.
    task.results.key: LINK_TO_SBOM
    task.results.type: external-link
spec:
  description: >-
    Generate a digest-bound CycloneDX SBOM, upload it to RHTPA, and run the
    matching RHACS image scan/check. The gate is deliberately opt-in until the
    platform credentials and policy have been validated.
  params:
  - name: image-reference
    type: string
  - name: image-digest
    type: string
  - name: source-revision
    type: string
  - name: source-repository
    type: string
  - name: application-name
    type: string
  - name: pipeline-run
    type: string
  - name: enforcement
    type: string
    default: disabled
    description: disabled is an auditable no-op; observe reports; gate fails on scanner or policy failure.
  - name: rhtpa-url
    type: string
    default: ''
    description: RHTPA base URL; empty means BOX1_TPA_URL, else https://tpa.apps.ocp.box1.org.
  - name: rhtpa-issuer
    type: string
    default: ''
    description: OIDC issuer for the rhtpa-ci client; empty means BOX1_OIDC_ISSUER, else https://keycloak.apps.ocp.box1.org/auth/realms/box1.
  - name: rhtpa-secret
    type: string
  - name: rhacs-endpoint
    type: string
    default: central.stackrox:443
  - name: rhacs-secret
    type: string
  - name: rhacs-console-url
    type: string
    default: ''
    description: ACS Central console base URL, used to build a link to the scanned image; empty means BOX1_ACS_URL, else https://acs.apps.ocp.box1.org.
  results:
  - name: sbom-id
    type: string
  - name: findings
    type: string
  - name: policy
    type: string
  - name: rhacs-url
    type: string
    description: ACS console page for the scanned image (CVEs and policy violations).
  - name: rhtpa-sbom-url
    type: string
    description: RHTPA console page for the uploaded SBOM.
  - name: LINK_TO_SBOM
    type: string
    description: >-
      Same URL as rhtpa-sbom-url, under the name the OpenShift Pipelines console
      reads for "View SBOM". Written only after a successful RHTPA upload.
  - name: SCAN_OUTPUT
    type: string
    description: >-
      RHACS vulnerability counts as {"vulnerabilities":{"critical","high","medium","low"}}
      for the console Vulnerabilities column. Expose it as a Pipeline result whose
      name ends in SCAN_OUTPUT. Always written, because a Pipeline result that
      references an unwritten Task result fails the PipelineRun with
      CouldntGetPipelineResult (box1-docs#42). Without a roxctl summary the value
      is "disabled" (enforcement disabled) or "unavailable" (no scan summary). The
      console cannot show "-" for those: any result ending in SCAN_OUTPUT renders
      as counts, so they display as zeros. Read the value, not the column.
  volumes:
  - name: reports
    emptyDir: {}
  - name: rhacs-ca
    configMap:
      name: rhacs-central-ca
      optional: true
  steps:
  - name: sbom-and-rhtpa
    # box1-org/box1-build builder image: syft 1.55.0, roxctl 4.11.6 and Python 3.11 baked in,
    # so no GitHub Releases or mirror.openshift.com download at run time (box1-docs#113).
    image: image-registry.openshift-image-registry.svc:5000/box1-build/box1-builder@sha256:358c338ab8f5972dba2886e35ae7b0804c48abbcbe639a687b7587f09d7ca79e
    env:
    - name: HOME
      value: /tekton/home
    - name: IMAGE_REFERENCE
      value: $(params.image-reference)
    - name: IMAGE_DIGEST
      value: $(params.image-digest)
    - name: SOURCE_REVISION
      value: $(params.source-revision)
    - name: SOURCE_REPOSITORY
      value: $(params.source-repository)
    - name: APPLICATION_NAME
      value: $(params.application-name)
    - name: PIPELINE_RUN
      value: $(params.pipeline-run)
    - name: RHTPA_URL
      value: $(params.rhtpa-url)
    - name: RHTPA_ISSUER
      value: $(params.rhtpa-issuer)
    - name: RHTPA_CLIENT_ID
      value: rhtpa-ci
    - name: RHTPA_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: $(params.rhtpa-secret)
          key: client-secret
          optional: true
    - name: ENFORCEMENT
      value: $(params.enforcement)
    # Optional cluster/org settings (RHDP); absent on the homelab, so the defaults apply.
    envFrom:
    - configMapRef:
        name: box1-platform-settings
        optional: true
    volumeMounts:
    - name: reports
      mountPath: /reports
    script: |
      #!/usr/bin/env python3
      import hashlib, io, json, os, pathlib, re, shutil, tarfile, urllib.parse, urllib.request
      # Param, then the box1-platform-settings ConfigMap, then the homelab endpoint.
      rhtpa_url=os.environ['RHTPA_URL'] or os.environ.get('BOX1_TPA_URL','https://tpa.apps.ocp.box1.org')
      rhtpa_issuer=os.environ['RHTPA_ISSUER'] or os.environ.get('BOX1_OIDC_ISSUER','https://keycloak.apps.ocp.box1.org/auth/realms/box1')
      if os.environ['ENFORCEMENT']=='disabled':
          pathlib.Path('/tekton/results/sbom-id').write_text('disabled')
          pathlib.Path('/tekton/results/rhtpa-sbom-url').write_text('disabled')
          print('Security gate disabled by explicit pipeline parameter')
          raise SystemExit(0)
      digest=os.environ['IMAGE_DIGEST']
      revision=os.environ['SOURCE_REVISION']
      if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest): raise SystemExit('Exact image digest is required')
      if not re.fullmatch(r'[a-f0-9]{40}', revision): raise SystemExit('Full source revision is required')
      if not os.environ['IMAGE_REFERENCE'].endswith('@'+digest): raise SystemExit('Image reference is not digest-bound')
      # Platform-owned checksum of the syft 1.55.0 linux_amd64 binary in the builder image.
      syft='/usr/local/bin/syft'
      if hashlib.sha256(pathlib.Path(syft).read_bytes()).hexdigest()!='64c9631c3560336c55c549df0de08cd577d02399c9de807ac390960a4ed5c351': raise SystemExit('Syft checksum mismatch')
      sbom=pathlib.Path('/reports/sbom.cdx.json')
      import subprocess
      registry_token=pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount/token').read_text().strip()
      subprocess.run([syft, 'login', 'image-registry.openshift-image-registry.svc:5000', '-u', 'serviceaccount', '-p', registry_token], check=True, timeout=60)
      subprocess.run([syft, 'scan', 'registry:'+os.environ['IMAGE_REFERENCE'], '-o', 'cyclonedx-json@1.5='+str(sbom)], check=True, timeout=900)
      document=json.loads(sbom.read_text())
      if document.get('bomFormat')!='CycloneDX' or document.get('specVersion')!='1.5': raise SystemExit('Syft did not produce CycloneDX 1.5')
      labels={'labels.image-digest':digest,'labels.source-revision':revision,'labels.service':os.environ['APPLICATION_NAME'],'labels.source-repository':os.environ['SOURCE_REPOSITORY'],'labels.pipeline-run':os.environ['PIPELINE_RUN']}
      form=urllib.parse.urlencode({'grant_type':'client_credentials','client_id':os.environ['RHTPA_CLIENT_ID'],'client_secret':os.environ['RHTPA_CLIENT_SECRET']}).encode()
      with urllib.request.urlopen(rhtpa_issuer+'/protocol/openid-connect/token', data=form, timeout=60) as response: token=json.load(response)['access_token']
      endpoint=rhtpa_url+'/api/v3/sbom?format=cyclonedx&cache=Wait&'+urllib.parse.urlencode(labels)
      request=urllib.request.Request(endpoint, data=json.dumps(document).encode(), method='POST', headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
      with urllib.request.urlopen(request, timeout=300) as response:
          if response.status!=201: raise SystemExit('RHTPA rejected the SBOM')
          result=json.loads(response.read())
      sbom_id=result.get('id') or result.get('sbomId') or 'accepted'
      pathlib.Path('/tekton/results/sbom-id').write_text(sbom_id)
      sbom_url=rhtpa_url.rstrip('/')+'/sboms'+('' if sbom_id=='accepted' else '/'+urllib.parse.quote(sbom_id, safe=':'))
      pathlib.Path('/tekton/results/rhtpa-sbom-url').write_text(sbom_url)
      pathlib.Path('/tekton/results/LINK_TO_SBOM').write_text(sbom_url)
      print('RHTPA SBOM: '+sbom_url)
      print('SBOM accepted by RHTPA: '+sbom_id+' digest='+digest+' revision='+revision)
  - name: rhacs-scan-and-check
    # box1-org/box1-build builder image: syft 1.55.0, roxctl 4.11.6 and Python 3.11 baked in,
    # so no GitHub Releases or mirror.openshift.com download at run time (box1-docs#113).
    image: image-registry.openshift-image-registry.svc:5000/box1-build/box1-builder@sha256:358c338ab8f5972dba2886e35ae7b0804c48abbcbe639a687b7587f09d7ca79e
    env:
    - name: HOME
      value: /tekton/home
    - name: IMAGE_REFERENCE
      value: $(params.image-reference)
    - name: IMAGE_DIGEST
      value: $(params.image-digest)
    - name: ENFORCEMENT
      value: $(params.enforcement)
    - name: RHACS_ENDPOINT
      value: $(params.rhacs-endpoint)
    - name: ROX_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: $(params.rhacs-secret)
          key: rox-api-token
          optional: true
    - name: ROX_CA_CERT_FILE
      value: /etc/rhacs-ca/ca.pem
    - name: RHACS_CONSOLE_URL
      value: $(params.rhacs-console-url)
    # Optional cluster/org settings (RHDP); absent on the homelab, so the defaults apply.
    envFrom:
    - configMapRef:
        name: box1-platform-settings
        optional: true
    volumeMounts:
    - name: reports
      mountPath: /reports
    - name: rhacs-ca
      mountPath: /etc/rhacs-ca
      readOnly: true
    script: |
      #!/usr/bin/env python3
      import hashlib, os, pathlib, subprocess, urllib.request
      if os.environ['ENFORCEMENT']=='disabled':
          pathlib.Path('/tekton/results/findings').write_text('disabled')
          pathlib.Path('/tekton/results/policy').write_text('disabled')
          pathlib.Path('/tekton/results/rhacs-url').write_text('disabled')
          pathlib.Path('/tekton/results/SCAN_OUTPUT').write_text('disabled')
          print('Security gate disabled by explicit pipeline parameter')
          raise SystemExit(0)
      # Platform-owned checksum of the roxctl 4.11.6 binary in the builder image.
      binary=pathlib.Path('/usr/local/bin/roxctl')
      if hashlib.sha256(binary.read_bytes()).hexdigest()!='975fea98a30d2b4e55444366e9202297b4ff0b2a1f5c783994f5af5788b5f983': raise SystemExit('roxctl checksum mismatch')
      env=os.environ.copy(); env['ROX_API_TOKEN']=env['ROX_API_TOKEN']
      scan=subprocess.run([str(binary),'image','scan','--endpoint',env['RHACS_ENDPOINT'],'--image',env['IMAGE_REFERENCE'],'--output','json'], env=env, text=True, capture_output=True, timeout=900)
      pathlib.Path('/reports/rhacs-scan.json').write_text(scan.stdout)
      check=subprocess.run([str(binary),'image','check','--endpoint',env['RHACS_ENDPOINT'],'--image',env['IMAGE_REFERENCE'],'--output','json'], env=env, text=True, capture_output=True, timeout=900)
      pathlib.Path('/reports/rhacs-check.json').write_text(check.stdout)
      pathlib.Path('/tekton/results/findings').write_text('scan-exit='+str(scan.returncode))
      pathlib.Path('/tekton/results/policy').write_text('pass' if check.returncode==0 else 'fail')
      print('RHACS scan exit='+str(scan.returncode)+' check exit='+str(check.returncode)+' digest='+env['IMAGE_DIGEST'])
      # Console Vulnerabilities column. roxctl reports RHACS severities in
      # result.summary; map them to the console's four buckets. SCAN_OUTPUT is
      # always written (see the result description): "unavailable" first, then
      # replaced by the counts when a summary exists.
      pathlib.Path('/tekton/results/SCAN_OUTPUT').write_text('unavailable')
      try:
          import json
          summary=json.loads(scan.stdout)['result']['summary'] if scan.returncode==0 else None
          if isinstance(summary, dict):
              counts={'critical':int(summary.get('CRITICAL',0)),'high':int(summary.get('IMPORTANT',0)),'medium':int(summary.get('MODERATE',0)),'low':int(summary.get('LOW',0))}
              pathlib.Path('/tekton/results/SCAN_OUTPUT').write_text(json.dumps({'vulnerabilities':counts}, sort_keys=True))
              print('RHACS vulnerability counts: '+json.dumps(counts, sort_keys=True))
          else:
              print('RHACS: no scan summary; SCAN_OUTPUT=unavailable')
      except Exception as error:
          print('RHACS: could not read the scan summary ('+type(error).__name__+'); SCAN_OUTPUT=unavailable')
      # The ACS console addresses images by a UUIDv5 of (image full name, digest),
      # not by digest (stackrox pkg/images/utils NewImageV2ID). Ask Central for the
      # scanned image; use its id if it is already a UUID, otherwise derive it.
      # Param, then the box1-platform-settings ConfigMap, then the homelab console.
      console=(env['RHACS_CONSOLE_URL'] or env.get('BOX1_ACS_URL','https://acs.apps.ocp.box1.org')).rstrip('/')
      rhacs_url=console+'/main/vulnerabilities/all-images'
      try:
          import json, re, ssl, urllib.parse, uuid
          cafile=env['ROX_CA_CERT_FILE']
          ctx=ssl.create_default_context(cafile=cafile) if os.path.exists(cafile) else ssl.create_default_context()
          query=urllib.parse.urlencode({'query':'Image Sha:'+env['IMAGE_DIGEST']})
          request=urllib.request.Request('https://'+env['RHACS_ENDPOINT']+'/v1/images?'+query, headers={'Authorization':'Bearer '+env['ROX_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=60, context=ctx) as response: images=json.load(response).get('images') or []
          match=[i for i in images if i.get('name')==env['IMAGE_REFERENCE']] or images
          if match:
              image_id=match[0].get('id','')
              if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', image_id):
                  namespace=uuid.UUID(bytes=hashlib.sha256(match[0]['name'].encode()).digest()[:16])
                  image_id=str(uuid.uuid5(namespace, env['IMAGE_DIGEST']))
              rhacs_url=console+'/main/vulnerabilities/all-images/images/'+image_id+'?vulnerabilityState=OBSERVED&detailsTab=Vulnerabilities'
          else:
              print('RHACS: image not found in Central; linking to the image list')
      except Exception as error:
          print('RHACS: could not resolve the console image id ('+type(error).__name__+'); linking to the image list')
      pathlib.Path('/tekton/results/rhacs-url').write_text(rhacs_url)
      print('RHACS image report: '+rhacs_url)
      if scan.returncode!=0: print('roxctl image scan stderr:\n'+scan.stderr[-2000:])
      if check.returncode!=0: print('roxctl image check stderr:\n'+check.stderr[-2000:])
      if env['ENFORCEMENT']=='gate' and scan.returncode!=0: raise SystemExit('RHACS scan failed; the image was not evaluated')
      if env['ENFORCEMENT']=='gate' and check.returncode!=0: raise SystemExit('RHACS security gate rejected the image, or the check could not run; see stderr above')
      if env['ENFORCEMENT'] not in ['observe','gate']: raise SystemExit('enforcement must be disabled, observe, or gate')
      if check.returncode!=0: print('OBSERVE: RHACS policy would reject this image; promotion remains report-only')
  - name: evidence
    image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
    env:
    - name: IMAGE_DIGEST
      value: $(params.image-digest)
    - name: SOURCE_REVISION
      value: $(params.source-revision)
    volumeMounts:
    - name: reports
      mountPath: /reports
    script: |
      #!/usr/bin/env python3
      import json, os, pathlib
      evidence={'imageDigest':os.environ['IMAGE_DIGEST'],'sourceRevision':os.environ['SOURCE_REVISION'],'sbom':pathlib.Path('/reports/sbom.cdx.json').exists(),'rhacsScan':pathlib.Path('/reports/rhacs-scan.json').exists(),'rhacsCheck':pathlib.Path('/reports/rhacs-check.json').exists()}
      pathlib.Path('/reports/evidence.json').write_text(json.dumps(evidence, sort_keys=True)+'\n')
      print(json.dumps(evidence, sort_keys=True))
