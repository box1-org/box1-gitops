# Legacy ERP appliance: box1-org/box1-ops-erp-simulator, box1-org/box1-docs#14 and #25.
#
# Python, not the Quarkus Golden Path.
#   - Pull requests run as ci-test (existing; no API token, no registry rights).
#   - Pushes to main run the shared legacy-erp-appliance Pipeline, defined once in
#     box1-org/legacy-erp/.tekton/appliance-pipeline.yaml (box1-docs#25): ERP tests,
#     then the legacy-erp bootc OS image built with this repository's source,
#     security, disk, promotion to box1-workloads-dev, and `bootc upgrade --apply`
#     in the VM. Hence the token scope below, matching the legacy-erp Repository.
#   - The earlier one-layer bundle image (ci-erp-release, ImageStream below) is no
#     longer produced; removing it is a box1-docs#25 follow-up.
# No credentials in Git.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: box1-ops-erp-simulator
  namespace: box1-ci
spec:
  url: https://github.com/box1-org/box1-ops-erp-simulator
  concurrency_limit: 1
  settings:
    pipelinerun_provenance: default_branch
    github_app_token_scope_repos:
    - box1-org/box1-workloads-dev
    - box1-org/legacy-erp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-erp-release
  namespace: box1-ci
---
# Declared so the release never needs rights to create image streams.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: box1-ops-erp-simulator
  namespace: box1-ci
spec:
  lookupPolicy:
    local: false
---
# Push to this one ImageStream only (system:image-builder would allow any in box1-ci).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-erp-release-push
  namespace: box1-ci
rules:
  - apiGroups: ["", "image.openshift.io"]
    resources: ["imagestreams/layers"]
    resourceNames: ["box1-ops-erp-simulator"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-erp-release-push
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-erp-release-push
subjects:
  - kind: ServiceAccount
    name: ci-erp-release
    namespace: box1-ci
