# Legacy ERP appliance: box1-org/box1-ops-erp-simulator, box1-org/box1-docs#14.
#
# Python, not the Quarkus Golden Path: the repository's .tekton/ runs inline tasks.
#   - Pull requests run as ci-test (existing; no API token, no registry rights).
#   - Pushes to main run as ci-erp-release: tests, then a one-layer OCI image holding
#     the wheel, systemd units and docs, pushed by digest to this ImageStream, then the
#     central box1-security-gates task (observe). The VM image build (#25) pins that digest.
# Nothing here is privileged: the image is assembled in Python and copied with skopeo.
# No credentials in Git: the push uses the service account's own token.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: box1-ops-erp-simulator
  namespace: box1-ci
spec:
  url: https://github.com/box1-org/box1-ops-erp-simulator
  concurrency_limit: 1
  settings:
    pipelinerun_provenance: default_branch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-erp-release
  namespace: box1-ci
---
# Declared so the release never needs rights to create image streams.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: box1-ops-erp-simulator
  namespace: box1-ci
spec:
  lookupPolicy:
    local: false
---
# Push to this one ImageStream only (system:image-builder would allow any in box1-ci).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-erp-release-push
  namespace: box1-ci
rules:
  - apiGroups: ["", "image.openshift.io"]
    resources: ["imagestreams/layers"]
    resourceNames: ["box1-ops-erp-simulator"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-erp-release-push
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-erp-release-push
subjects:
  - kind: ServiceAccount
    name: ci-erp-release
    namespace: box1-ci
