---
# Container images that run inside the edge site VMs (box1-docs#126), mirrored into box1-ci by digest, so a
# site pulls them from the internal registry with the pull token it already has for bootc
# (system:image-puller on box1-ci for site-*-dev) and the image never contains a registry credential.
# The import uses box1-ci's existing registry.redhat.io pull secret. PreserveOriginal keeps the manifest-list
# digest, which is the digest site-gateway-os pins in its quadlets.
#
# AMQ Broker 7.14.1 (Artemis) with MQTT: registry.redhat.io/amq7/amq-broker-rhel9, tag 7.14.1-3.1793307801.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: site-amq-broker
  namespace: box1-ci
spec:
  lookupPolicy:
    local: false
  tags:
  - name: 7.14.1-3.1793307801
    from:
      kind: DockerImage
      name: registry.redhat.io/amq7/amq-broker-rhel9@sha256:e77cb86f876b3ba2c4f853e8044b2ab5864346bc4b17e788a0da1287e7c8ec69
    importPolicy:
      importMode: PreserveOriginal
    referencePolicy:
      type: Local
---
# PostgreSQL 16 on RHEL 10: registry.redhat.io/rhel10/postgresql-16, tag 10.2-1794220679.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: site-postgresql
  namespace: box1-ci
spec:
  lookupPolicy:
    local: false
  tags:
  - name: 10.2-1794220679
    from:
      kind: DockerImage
      name: registry.redhat.io/rhel10/postgresql-16@sha256:640273e1145aa1ff9bba43930d6042839240fd1b791d1970c607374413c6b03b
    importPolicy:
      importMode: PreserveOriginal
    referencePolicy:
      type: Local
