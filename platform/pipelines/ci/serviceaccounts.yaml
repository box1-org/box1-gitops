# Smoke/PR checks have no registry or deployment credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-test
  namespace: box1-ci
automountServiceAccountToken: false
---
# Trusted builds only. Registry authorization is scoped to box1-ci.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build
  namespace: box1-ci
---
# Mount gitops-writer explicitly in a trusted update task, never on ci-test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-gitops
  namespace: box1-ci
