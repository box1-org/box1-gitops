apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-observe
  namespace: box1-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quarkus-release-observer
  namespace: quarkus-reference
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [quarkus-reference]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quarkus-release-observer
  namespace: quarkus-reference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quarkus-release-observer
subjects:
  - kind: ServiceAccount
    name: ci-observe
    namespace: box1-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quarkus-argocd-observer
  namespace: openshift-gitops
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [quarkus-reference]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quarkus-argocd-observer
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quarkus-argocd-observer
subjects:
  - kind: ServiceAccount
    name: ci-observe
    namespace: box1-ci
