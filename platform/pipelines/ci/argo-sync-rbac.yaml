apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-gitops-argo-sync
  namespace: openshift-gitops
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-gitops-argo-sync
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-gitops-argo-sync
subjects:
- kind: ServiceAccount
  name: ci-gitops
  namespace: box1-ci
