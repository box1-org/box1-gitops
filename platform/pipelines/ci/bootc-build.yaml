# Shared CI identities for RHEL image mode (bootc) VM workloads (box1-docs#55).
# Generated VM repositories use them through the central box1-bootc-* Tasks; each
# workload's own PaC Repository and registry pull binding come from its
# box1-workloads-dev onboarding.yaml.
#
# Both identities can run PRIVILEGED pods:
#   - buildah needs overlay storage: the RHEL bootc base has ~66 layers, so vfs
#     would copy the full filesystem once per layer (~100 GB per build).
#   - bootc-image-builder (osbuild) needs privileged mode to make VM disks.
# Any PipelineRun in box1-ci could name these SAs; moving them to a dedicated
# namespace is a box1-docs#55 follow-up.
#
# Created outside Git (no credentials in Git), shared by all bootc builds:
#   - Secret box1-ci/redhat-registry-pull: dockerconfigjson with only the
#     registry.redhat.io entry from the cluster pull secret.
#   - Secret box1-ci/etc-pki-entitlement: copy of
#     openshift-config-managed/etc-pki-entitlement (refresh when it rotates).
---
# PR builds: privileged build and lint only; no API token, no registry rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bootc-check
  namespace: box1-ci
automountServiceAccountToken: false
---
# Releases: build, disk and channel tag moves; pushes to box1-ci.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bootc-release
  namespace: box1-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bootc-privileged-scc
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: ci-bootc-check
    namespace: box1-ci
  - kind: ServiceAccount
    name: ci-bootc-release
    namespace: box1-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bootc-release-image-builder
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: ci-bootc-release
    namespace: box1-ci
---
# Deploys: box1-bootc-apply runs `bootc upgrade --apply` in a promoted VM over
# virtctl ssh. Unprivileged. Each workload grants it `get` on its VMI and
# virtualmachineinstances/portforward in its own box1-workloads-dev manifests.
# The SSH private key is a Secret created outside Git, one per workload:
#   - Secret box1-ci/legacy-erp-deploy-ssh (key ssh-privatekey), box1-docs#25.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-vm-deploy
  namespace: box1-ci
