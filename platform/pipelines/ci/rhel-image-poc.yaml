# RHEL 10 image mode POC: box1-org/rhel-image-poc (box1-docs#46). Its shared build
# identities now live in bootc-build.yaml. Remove this file when the POC is
# retired (box1-docs#55 phase 4); onboarded VM workloads carry these two objects in
# their own box1-workloads-dev onboarding.yaml.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: rhel-image-poc
  namespace: box1-ci
spec:
  url: https://github.com/box1-org/rhel-image-poc
  concurrency_limit: 1
  settings:
    pipelinerun_provenance: default_branch
---
# The VM namespace imports its disk (DataVolume, pullMethod: node) from box1-ci.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhel-image-poc-image-puller
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:rhel-image-poc
