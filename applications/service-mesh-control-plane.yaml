apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh-control-plane
  namespace: openshift-gitops
  labels:
    box1.org/profile: operate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/service-mesh/mesh
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - PruneLast=true
    # Argo CD has no health check for the Istio CR, so the first sync can
    # reach the Telemetry before istiod's validating webhook has endpoints.
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
