---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "orders-service"
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: workloads/orders-service
  destination:
    server: https://kubernetes.default.svc
    namespace: "orders-service-dev"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
