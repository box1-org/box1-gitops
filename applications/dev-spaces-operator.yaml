apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-spaces-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/dev-spaces/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-devspaces
  # Manual sync; OLM InstallPlans require explicit approval.
  syncPolicy:
    syncOptions:
      - PruneLast=true
