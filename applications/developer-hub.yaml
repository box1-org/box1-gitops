apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/developer-hub
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh
  syncPolicy:
    # Manual sync: wait for the separate Operator application and external secrets.
    syncOptions:
      - PruneLast=true
