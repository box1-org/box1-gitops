apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: box1-kafka
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: box1-kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
