apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub-gitops-access
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/gitops/developer-hub-access
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    syncOptions:
      - PruneLast=true
