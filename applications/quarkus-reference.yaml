apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quarkus-reference
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: workloads/quarkus-reference
  destination:
    server: https://kubernetes.default.svc
    namespace: quarkus-reference
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - PruneLast=true
