{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "acs",
    "namespace": "openshift-gitops"
  },
  "spec": {
    "project": "default",
    "source": {
      "repoURL": "https://github.com/box1-org/box1-gitops.git",
      "targetRevision": "main",
      "path": "platform/advanced-cluster-security/instance"
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "stackrox"
    },
    "syncPolicy": {
      "syncOptions": [
        "PruneLast=true"
      ]
    }
  }
}
