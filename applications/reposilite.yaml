apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reposilite
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/reposilite
  destination:
    server: https://kubernetes.default.svc
    namespace: box1-maven
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
