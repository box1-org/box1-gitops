apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-spaces
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/dev-spaces/instance
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-devspaces
  # The operator must be ready before the CheCluster is synced.
  syncPolicy:
    syncOptions:
      - PruneLast=true
