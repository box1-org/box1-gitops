apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hawtio
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/hawtio/instance
  destination:
    server: https://kubernetes.default.svc
    namespace: hawtio
  # The operator must be ready before the Hawtio CR is synced.
  syncPolicy:
    syncOptions:
      - PruneLast=true
