apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh-kiali
  namespace: openshift-gitops
  labels:
    box1.org/profile: operate
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: platform/service-mesh/kiali
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - PruneLast=true
