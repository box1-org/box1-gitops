# Trusted main-branch infrastructure check; never runs application or PR code.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: box1-gitops-auth-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: ci-gitops
  timeouts:
    pipeline: 10m
  pipelineSpec:
    tasks:
      - name: verify-gitops-access
        taskSpec:
          steps:
            - name: verify
              image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
              env:
                - name: HOME
                  value: /tekton/home
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{git_auth_secret}}"
                      key: git-provider-token
              script: |
                #!/usr/bin/env python3
                import json
                import os
                import urllib.request

                def github(path, payload=None):
                    request = urllib.request.Request(
                        'https://api.github.com' + path,
                        data=None if payload is None else json.dumps(payload).encode(),
                        headers={
                            'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                            'Accept': 'application/vnd.github+json',
                            'User-Agent': 'box1-gitops-auth-check',
                            'X-GitHub-Api-Version': '2022-11-28',
                        },
                    )
                    with urllib.request.urlopen(request, timeout=30) as response:
                        return json.load(response)

                prefix = '/repos/box1-org/box1-gitops'
                existing = github(prefix + '/contents/README.md?ref=main')
                # This write API requires Contents:write. Resubmit existing bytes,
                # yielding the same content-addressed blob; no refs/files change.
                result = github(prefix + '/git/blobs', {
                    'content': existing['content'],
                    'encoding': 'base64',
                })
                assert result['sha'] == existing['sha'], 'Blob identity mismatch'
                print('PAC-generated token successfully used the GitOps Contents:write API.')
                print('Existing blob verified; no branches, files, or workloads changed.')
